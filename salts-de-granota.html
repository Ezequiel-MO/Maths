<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>Salts de Granota</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one centred column on a pond; the number line is the stage, the sum sits above it, the answer box below. */
:root {
  --water: #DDF1EE; --water-deep: #BFE3DF; --surface: #FFFFFF; --line: #9CCFC9;
  --ink: #0F3A40; --muted: #4E7379;
  --pad: #3E9B4F; --pad-dark: #2C7A3C; --on-pad: #FFFFFF;
  --flower: #E24C86; --sun: #F2B632; --bad: #C8452F;
  --display: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --water: #0C2A30; --water-deep: #123A41; --surface: #16424A; --line: #2F666D;
    --ink: #E6F5F1; --muted: #9EC3C0;
    --pad: #4FB562; --pad-dark: #2F7F40; --on-pad: #06220D;
    --flower: #FF79A8; --sun: #F7C64E; --bad: #FF8A70; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --water: #0C2A30; --water-deep: #123A41; --surface: #16424A; --line: #2F666D;
  --ink: #E6F5F1; --muted: #9EC3C0;
  --pad: #4FB562; --pad-dark: #2F7F40; --on-pad: #06220D;
  --flower: #FF79A8; --sun: #F7C64E; --bad: #FF8A70; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; min-height: 100vh; padding-inline: 16px; padding-block: 20px 40px;
  background: radial-gradient(120% 80% at 50% 110%, var(--water-deep), var(--water) 60%) var(--water);
  color: var(--ink); font: 500 1.125rem/1.45 var(--body);
}
#app { max-width: 860px; margin-inline: auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, .big, .num, .btn { font-family: var(--display); }
h1 { font-size: clamp(2.2rem, 7vw, 3.6rem); line-height: 1; margin: 0; font-weight: 800; text-wrap: balance; }
h2 { font-size: 1.6rem; line-height: 1.1; margin: 0; font-weight: 800; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--flower); outline-offset: 3px; }

.btn {
  border: 0; border-radius: 999px; padding: 0.45em 1.3em; font-size: 1.25rem; font-weight: 800;
  background: var(--pad); color: var(--on-pad); box-shadow: 0 4px 0 var(--pad-dark);
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--pad-dark); }
.btn.soft { background: var(--surface); color: var(--ink); box-shadow: 0 4px 0 var(--line); }
.link { background: none; border: 0; padding: 4px 0; color: var(--muted); font-weight: 700; text-decoration: underline; font-size: 1rem; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center; }

/* home: a trail of lily pads across the pond */
.hero { display: flex; flex-direction: column; gap: 8px; }
.lead { color: var(--muted); max-width: 46ch; }
.trail { position: relative; aspect-ratio: 860 / 480; }
.trail > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.way { fill: none; stroke: var(--line); stroke-width: 12; stroke-linecap: round; stroke-dasharray: 1 26; }
.trail ol { list-style: none; margin: 0; padding: 0; }
.trail li { position: absolute; left: calc(var(--x) / 860 * 100%); top: calc(var(--y) / 480 * 100%); width: 172px; margin-left: -86px; margin-top: -38px; }
.world { position: relative; width: 100%; border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
.world:disabled { cursor: not-allowed; opacity: 0.55; }
.lily {
  width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; transition: transform 0.15s;
  background: conic-gradient(from 110deg, var(--pad) 325deg, transparent 0); color: var(--on-pad);
  font: 800 2.3rem/1 var(--display);
}
.world:not(:disabled):hover .lily { transform: scale(1.1); }
.tag { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; background: var(--water); border-radius: 16px; padding: 4px 10px 6px; }
.world b { font: 800 1.2rem/1.1 var(--display); }
.world .ex { color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
.here { position: absolute; top: -40px; left: 50%; width: 58px; margin-left: -29px; }
.stars { letter-spacing: 2px; color: var(--line); font-size: 1.3rem; line-height: 1; }
.stars i { font-style: normal; color: var(--sun); }
@media (max-width: 700px) {
  .trail { aspect-ratio: auto; }
  .trail > svg { display: none; }
  .trail ol { display: flex; flex-direction: column; gap: 46px; padding-top: 44px; }
  .trail li { position: static; margin: 0; }
  .trail li:nth-child(even) { align-self: flex-end; }
}
.foot { display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: space-between; align-items: center; color: var(--muted); }

/* world header */
.top { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.tabs { display: flex; gap: 6px; background: var(--surface); border-radius: 999px; padding: 5px; border: 2px solid var(--line); }
.tabs button { border: 0; background: none; border-radius: 999px; padding: 2px 16px; font-weight: 800; color: var(--muted); }
.tabs button[aria-current="step"] { background: var(--pad); color: var(--on-pad); }

/* play area */
.play { background: var(--surface); border-radius: 28px; padding: 22px 18px 26px; display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center; }
.big { font-size: clamp(2.6rem, 9vw, 4.6rem); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.q { color: var(--flower); }
.cap { min-height: 2.9em; font-size: 1.3rem; font-weight: 700; max-width: 34ch; text-wrap: balance; }
.count, .hud { color: var(--muted); font-weight: 700; }
.hud { width: 100%; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center; }
.dots { display: flex; gap: 6px; }
.dots i { width: 14px; height: 14px; border-radius: 50%; background: var(--line); }
.dots i.ok { background: var(--sun); }
.dots i.slow { background: var(--muted); }
.dots i.now { outline: 3px solid var(--flower); outline-offset: 1px; }
.timer { width: 100%; height: 12px; border-radius: 999px; background: var(--water-deep); overflow: hidden; }
.timer i { display: block; height: 100%; background: var(--pad); transform-origin: left; }
#viz { width: 100%; }
svg.nl { width: 100%; height: auto; display: block; }
.nl .axis { stroke: var(--line); stroke-width: 6; stroke-linecap: round; }
.nl .tick { stroke: var(--muted); stroke-width: 2; }
.nl .tick.ten { stroke-width: 5; }
.nl text { font-family: var(--display); text-anchor: middle; font-variant-numeric: tabular-nums; }
.nl .tl { fill: var(--muted); font-size: 26px; font-weight: 600; }
.nl .pl { fill: var(--ink); font-size: 36px; font-weight: 800; }
.nl .lp { fill: var(--pad); }
.nl .arc { fill: none; stroke: var(--flower); stroke-width: 5; stroke-linecap: round; }
.nl .jl { fill: var(--flower); font-size: 34px; font-weight: 800; }
.nl .fb { fill: var(--pad); stroke: var(--pad-dark); stroke-width: 2; }
.nl .fe, .here .fe { fill: var(--surface); stroke: var(--pad-dark); stroke-width: 2; }
.nl .fp, .here .fp { fill: var(--ink); }
.here .fb { fill: var(--pad); stroke: var(--pad-dark); stroke-width: 2; }
.fm { fill: none; stroke: var(--pad-dark); stroke-width: 2.5; stroke-linecap: round; }

.frame { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; max-width: 420px; margin-inline: auto; padding: 14px; border-radius: 20px; background: var(--water); }
.frame span { aspect-ratio: 1; border-radius: 50%; background: conic-gradient(from 110deg, var(--pad) 325deg, transparent 0); display: grid; place-items: center; }
.frame span::after { content: ""; width: 52%; aspect-ratio: 1; border-radius: 50%; }
.frame .on::after { background: radial-gradient(var(--sun) 32%, var(--flower) 34%); }
.frame .new::after { background: radial-gradient(var(--flower) 32%, var(--sun) 34%); animation: pop 0.25s ease-out; }

form { display: flex; flex-direction: column; gap: 10px; align-items: center; width: 100%; }
form label { font-size: 1.3rem; font-weight: 800; font-variant-numeric: tabular-nums; }
#ans {
  width: 5.2ch; text-align: center; font: 800 2.4rem/1.2 var(--display); color: var(--ink); background: var(--water);
  border: 3px solid var(--line); border-radius: 18px; padding: 2px 6px; font-variant-numeric: tabular-nums;
}
#eq, #tail { font: 800 2.4rem/1.2 var(--display); font-variant-numeric: tabular-nums; }
#eq:empty, #tail:empty { display: none; }
#ans:focus { outline: none; border-color: var(--flower); }
#msg { min-height: 1.5em; font-weight: 800; }
#msg.bad { color: var(--bad); }
#msg.good { color: var(--pad-dark); }
:root[data-theme="dark"] #msg.good { color: var(--pad); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #msg.good { color: var(--pad); } }
.shake { animation: shake 0.3s; }
.tricks { text-align: left; display: grid; gap: 10px; padding: 0; margin: 0; list-style: none; max-width: 46ch; }
.tricks b { font-family: var(--display); font-variant-numeric: tabular-nums; }
.result .stars { font-size: 3.4rem; letter-spacing: 6px; }
@keyframes pop { from { transform: scale(0.2); } }
@keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.split { font: 800 1.9rem/1.1 var(--display); color: var(--muted); font-variant-numeric: tabular-nums; margin-bottom: 10px; }
.split b { color: var(--flower); }
.blocks { display: flex; gap: 40px; justify-content: center; align-items: flex-end; }
.col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.col .h { font-size: 0.95rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.bars { display: flex; gap: 8px; justify-content: flex-end; min-width: 216px; height: 138px; }
.bar { width: 20px; height: 138px; border-radius: 4px; background: repeating-linear-gradient(to bottom, var(--pad) 0 12px, var(--pad-dark) 12px 14px); }
.bar.new { background: repeating-linear-gradient(to bottom, var(--flower) 0 12px, var(--sun) 12px 14px); }
.cubes { display: flex; flex-direction: column-reverse; gap: 2px; width: 20px; height: 138px; }
.cube { width: 20px; height: 12px; border-radius: 3px; background: var(--pad); flex: none; }
.cube.new { background: var(--flower); animation: pop 0.2s ease-out; }
.cubes.full { gap: 0; border-radius: 4px; outline: 3px solid var(--sun); outline-offset: 2px; }
.cubes.full .cube { height: 13.8px; border-radius: 0; background: var(--flower); }
.blocks + .split { margin: 14px 0 0; }
@media (prefers-reduced-motion: reduce) { .shake, .frame .new::after, .cube.new { animation: none; } }
</style>

<main id="app"></main>

<script>
/* LOGIC-START */
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[rnd(0, arr.length - 1)];
// Catalan articles elide before 1 (u) and 11 (onze)
const vow = n => n === 1 || n === 11;
const el = n => vow(n) ? `l'${n}` : `el ${n}`;
const del = n => vow(n) ? `de l'${n}` : `del ${n}`;
const al = n => vow(n) ? `a l'${n}` : `al ${n}`;
const cap = s => s[0].toUpperCase() + s.slice(1);
const bar = n => n === 1 ? '1 barra' : `${n} barres`;
const cub = n => n === 1 ? '1 cubet' : `${n} cubets`;
const falten = n => n === 1 ? 'En falta 1' : `En falten ${n}`;

function make(type, a, b) {
  if (type === 1) {
    const f = 10 - a;
    return { type, a, b: f, ans: f, key: '1:' + a, text: `${a} + <b class="q">?</b> = 10`, eq: `${a} + ${f} = 10`, jumps: [],
      caps: [`Tens ${a} ${a === 1 ? 'nenúfar' : 'nenúfars'} amb flor.`, `${falten(f)} per omplir els 10.`, `${a} i ${f} són amics del 10.`],
      steps: [{ hint: `Quin és l'amic del 10 ${del(a)}?`, eq: `${a} +`, tail: '= 10', ans: f, jump: 0 }] };
  }
  const ans = a + b, base = { type, a, b, ans, key: a + '+' + b, text: `${a} + ${b}`, eq: `${a} + ${b} = ${ans}` };
  if (type === 2) {
    const u = a % 10, t = (a - u) / 10;
    return { ...base, nj: 2, pre: true, jumps: [{ to: ans, lab: `+${b}` }],
      caps: [`${a} són ${bar(t)} de deu i ${cub(u)}.`, `${b === 1 ? 'Arriba' : 'Arriben'} ${cub(b)} més: ara n'hi ha 10 de solts.`, `10 cubets fan una barra nova. ${cap(bar(t + 1))} són ${ans}.`],
      steps: [{ hint: '10 cubets fan una barra nova', eq: `${a} + ${b} =`, ans, jump: 1 }] };
  }
  if (type === 3) {
    return { ...base, jumps: [{ to: ans, lab: '+10' }],
      caps: [`Sumar 10 és un salt gran.`, `La desena puja 1 i les unitats queden igual: ${ans}.`],
      steps: [{ hint: 'Només canvia la desena', eq: `${a} + 10 =`, ans, jump: 0 }] };
  }
  if (type === 4) {
    const k = 10 - b, t = a + 10;
    return { ...base, jumps: [{ to: t, lab: '+10' }, { to: ans, lab: `−${k}` }],
      caps: [`${cap(el(b))} és gairebé 10.`, `Primer suma 10: arribes ${al(t)}.`, `Te n'has passat ${k}. Torna enrere ${k}: ${ans}.`],
      pre: true, steps: [{ hint: `Suma 10 i torna enrere ${k}`, eq: `${a} + ${b} =`, ans, jump: 1 }] };
  }
  const T = Math.ceil(a / 10) * 10, c = T - a, r = b - c;
  return { ...base, jumps: [{ to: T, lab: `+${c}` }, { to: ans, lab: `+${r}` }],
    caps: [`Primer salta fins a la desena.`, `${cap(del(a))} fins ${al(T)} ${falten(c).toLowerCase()}.`, `${cap(el(b))} és ${c} i ${r}. Ja n'has fet ${c}, ${r === 1 ? 'en queda' : 'en queden'} ${r}: ${ans}.`],
    pre: true, steps: [{ hint: `Primer fins ${al(T)}, després el que queda ${del(b)}`, eq: `${a} + ${b} =`, ans, jump: 1 }] };
}

function gen(w) {
  if (w === 1) return make(1, rnd(1, 9));
  if (w === 2) { const u = rnd(1, 9); return make(2, 10 * rnd(1, 8) + u, 10 - u); }
  if (w === 3) return make(3, rnd(11, 89), 10);
  if (w === 4) return make(4, 10 * rnd(1, 8) + rnd(1, 9), pick([9, 9, 8]));
  if (w === 5) { const u = rnd(4, 9); return make(5, 10 * rnd(1, 8) + u, rnd(Math.max(2, 11 - u), 7)); }
  return gen(rnd(2, 5));
}

function round(w, n) {
  const out = [], seen = new Set();
  for (let tries = 0; out.length < n; tries++) {
    const p = gen(w);
    if (seen.has(p.key) && tries < 200) continue;
    seen.add(p.key); out.push(p);
  }
  return out;
}

const starsFor = fast => fast >= 9 ? 3 : fast >= 7 ? 2 : fast >= 5 ? 1 : 0;
/* LOGIC-END */

const WORLDS = [
  { name: 'Amics del 10', ex: '7 + ? = 10', tip: 'Cada número té un amic: junts fan 10.', secs: 6, demo: [[7], [6]] },
  { name: 'Arribar a la desena', ex: '32 + 8', tip: 'Deu cubets fan una barra: una desena més.', secs: 8, demo: [[32, 8], [46, 4]] },
  { name: 'Sumar 10', ex: '17 + 10', tip: 'Quan sumes 10, només canvia la desena.', secs: 8, demo: [[17, 10], [43, 10]] },
  { name: 'Sumar 9 i 8', ex: '17 + 9', tip: 'Suma 10 i torna enrere 1 (o 2).', secs: 12, demo: [[17, 9], [35, 8]] },
  { name: 'Passar per la desena', ex: '27 + 6', tip: 'Primer salta fins a la desena, després la resta.', secs: 12, demo: [[27, 6], [48, 5]] },
  { name: 'Barreja', ex: 'de tot', tip: 'Tria el truc que millor et vagi.', secs: 12 }
];
const KEY = 'salts-de-granota';
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = (s, r = document) => r.querySelector(s);
const app = $('#app');
const sleep = ms => new Promise(r => setTimeout(r, ms));

let prog = { stars: [0, 0, 0, 0, 0, 0], so: true };
try {
  const d = JSON.parse(localStorage.getItem(KEY));
  if (d && Array.isArray(d.stars) && d.stars.length === 6) prog = { stars: d.stars.map(n => Math.min(3, Math.max(0, n | 0))), so: d.so !== false };
} catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(prog)); } catch (e) {} };
const open = w => w === 1 || prog.stars[w - 2] > 0;

// every screen change cancels running animations and timers through this token
let tok = { on: true }, timer = 0;
function fresh() { tok.on = false; tok = { on: true }; clearTimeout(timer); return tok; }

let ac;
function beep(good) {
  if (!prog.so) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    (good ? [660, 880] : [200]).forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i * 0.09;
      o.type = good ? 'triangle' : 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.14, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 0.2);
    });
  } catch (e) {}
}

const starsHTML = n => `<span class="stars" role="img" aria-label="${n} de 3 estrelles"><i>${'★'.repeat(n)}</i>${'★'.repeat(3 - n)}</span>`;
const FROG = `<ellipse class="fb" cx="0" cy="-18" rx="21" ry="16"/><circle class="fe" cx="-10" cy="-33" r="8"/><circle class="fe" cx="10" cy="-33" r="8"/><circle class="fp" cx="-10" cy="-33" r="3.2"/><circle class="fp" cx="10" cy="-33" r="3.2"/><path class="fm" d="M-8 -14 Q0 -8 8 -14"/>`;

/* ---------- pictures: ten lily pads for world 1, a number line for the rest ---------- */
function frameViz(host, n) {
  host.innerHTML = `<div class="frame" role="img" aria-label="Deu nenúfars, ${n} amb flor">${Array.from({ length: 10 }, (_, i) => `<span${i < n ? ' class="on"' : ''}></span>`).join('')}</div>`;
  const pads = [...host.querySelectorAll('span')];
  return {
    async jump() { for (let i = n; i < 10; i++) { pads[i].className = 'new'; await sleep(RM ? 0 : 240); } },
    reset() { pads.forEach((e, i) => { if (i >= n) e.className = ''; }); }
  };
}
function Viz(host, p) {
  if (p.type === 1) return frameViz(host, p.a);
  return p.type === 2 ? blockViz(host, p) : lineViz(host, p);
}
// world 2: tens as bars, units as cubes; ten loose cubes turn into a new bar
function blockViz(host, p) {
  const u = p.a % 10, t = (p.a - u) / 10;
  host.innerHTML = `<div class="blocks"><div class="col"><span class="h">Desenes</span><div class="bars"></div></div><div class="col"><span class="h">Unitats</span><div class="cubes"></div></div></div><p class="split"></p>`;
  const bars = $('.bars', host), cubes = $('.cubes', host), sp = $('.split', host);
  const add = (to, cls) => { const e = document.createElement('i'); e.className = cls; to.appendChild(e); return e; };
  function reset() {
    bars.replaceChildren(); cubes.replaceChildren(); cubes.className = 'cubes';
    for (let i = 0; i < t; i++) add(bars, 'bar');
    for (let i = 0; i < u; i++) add(cubes, 'cube');
    sp.innerHTML = `${bar(t)} i ${cub(u)}`;
  }
  async function jump(i) {
    if (i === 0) {
      for (let k = 0; k < p.b; k++) { add(cubes, 'cube new'); await sleep(RM ? 0 : 200); }
      sp.innerHTML = `${bar(t)} i <b>${u} + ${p.b} = 10 cubets</b>`;
      return;
    }
    cubes.classList.add('full'); await sleep(RM ? 0 : 600);
    const r0 = cubes.getBoundingClientRect();
    cubes.replaceChildren(); cubes.className = 'cubes';
    const nb = add(bars, 'bar new'), r1 = nb.getBoundingClientRect();
    if (!RM && nb.animate) await nb.animate([{ transform: `translate(${r0.left - r1.left}px, ${r0.top - r1.top}px)` }, { transform: 'none' }], { duration: 700, easing: 'ease-in-out' }).finished;
    sp.innerHTML = `<b>${bar(t + 1)}</b> = ${p.ans}`;
  }
  reset();
  return { jump, reset };
}
function lineViz(host, p) {
  const pts = [p.a, ...p.jumps.map(j => j.to)], lo = Math.min(...pts) - 2, hi = Math.max(...pts) + 2;
  const X = n => 50 + (n - lo) / (hi - lo) * 900, Y = 170, NS = 'http://www.w3.org/2000/svg';
  let s = `<svg class="nl" viewBox="0 0 1000 232" role="img" aria-label="Recta numèrica: ${lo} a ${hi}"><line class="axis" x1="16" y1="${Y}" x2="984" y2="${Y}"/>`;
  for (let n = lo; n <= hi; n++) {
    s += `<line class="tick${n % 10 ? '' : ' ten'}" x1="${X(n)}" x2="${X(n)}" y1="${Y - 8}" y2="${Y + 8}"/>`;
    if (n % 10 === 0) s += `<text class="tl" data-n="${n}" x="${X(n)}" y="${Y + 48}">${n}</text>`;
  }
  host.innerHTML = s + `<g class="dyn"></g><g class="frog">${FROG}</g></svg>`;
  const dyn = $('.dyn', host), frog = $('.frog', host);
  const mk = (tag, at, txt) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); if (txt != null) e.textContent = txt; dyn.appendChild(e); return e; };
  const sit = (x, y) => frog.setAttribute('transform', `translate(${x} ${y})`);
  function pad(n) {
    const t = host.querySelector(`.tl[data-n="${n}"]`); if (t) t.setAttribute('visibility', 'hidden');
    mk('ellipse', { class: 'lp', cx: X(n), cy: Y, rx: 25, ry: 9 });
    mk('text', { class: 'pl', x: X(n), y: Y + 50 }, n);
  }
  function reset() {
    dyn.replaceChildren(); host.querySelectorAll('.tl').forEach(t => t.removeAttribute('visibility'));
    pad(p.a); sit(X(p.a), Y);
  }
  async function jump(i) {
    const x1 = X(pts[i]), x2 = X(pts[i + 1]), dx = Math.abs(x2 - x1), h = Math.min(108, 36 + dx * 0.15), mx = (x1 + x2) / 2;
    const arc = mk('path', { class: 'arc', d: `M${x1} ${Y - 10} Q${mx} ${Y - 10 - 2 * h} ${x2} ${Y - 10}`, pathLength: 1, 'stroke-dasharray': 1, 'stroke-dashoffset': 1 });
    const dur = RM ? 0 : Math.min(950, 380 + dx);
    const t0 = performance.now();
    await new Promise(done => {
      (function frame(now) {
        const t = dur ? Math.min(1, (now - t0) / dur) : 1, q = 1 - t;
        arc.setAttribute('stroke-dashoffset', q);
        sit(q * q * x1 + 2 * q * t * mx + t * t * x2, Y - 4 * h * q * t);
        t < 1 ? requestAnimationFrame(frame) : done();
      })(t0);
    });
    mk('text', { class: 'jl', x: mx, y: Y - 10 - h - 12 }, p.jumps[i].lab);
    pad(pts[i + 1]);
  }
  reset();
  return { jump, reset };
}

// narrate a trick: one caption per jump, then any closing caption
async function demo(p, v, capEl, t) {
  const say = async (txt, ms) => { capEl.textContent = txt; await sleep(ms); return t.on; };
  v.reset();
  if (!await say(p.caps[0], 1700)) return false;
  const n = p.nj || Math.max(1, p.jumps.length);
  for (let i = 0; i < n; i++) {
    capEl.textContent = p.caps[i + 1];
    await sleep(700); if (!t.on) return false;
    await v.jump(i); if (!t.on) return false;
    await sleep(1300); if (!t.on) return false;
  }
  for (let i = n + 1; i < p.caps.length; i++) if (!await say(p.caps[i], 1500)) return false;
  return true;
}

/* ---------- screens ---------- */
const PTS = [[90, 350], [240, 140], [410, 330], [560, 120], [690, 330], [775, 120]];
function home() {
  fresh();
  const total = prog.stars.reduce((a, b) => a + b, 0);
  const todo = prog.stars.findIndex((n, i) => open(i + 1) && !n), here = todo < 0 ? 5 : todo;
  const way = `M${PTS[0].join(' ')}` + PTS.slice(1).map(([x, y], i) => { const [x0, y0] = PTS[i], m = (x0 + x) / 2; return `C${m} ${y0} ${m} ${y} ${x} ${y}`; }).join('');
  app.innerHTML = `
    <header class="hero"><h1>Salts de Granota</h1><p class="lead">Aprèn trucs per sumar de cap, ben de pressa. Segueix el camí de nenúfars: a cada un, la granota t'ensenya un truc nou.</p></header>
    <div class="trail"><svg viewBox="0 0 860 480" aria-hidden="true"><path class="way" d="${way}"/></svg>
    <ol>${WORLDS.map((w, i) => `<li style="--x:${PTS[i][0]};--y:${PTS[i][1]}"><button class="world" data-w="${i + 1}" ${open(i + 1) ? '' : 'disabled title="Guanya una estrella al món anterior"'}>
      ${i === here ? `<svg class="here" viewBox="-30 -46 60 50" aria-hidden="true">${FROG}</svg>` : ''}<span class="lily">${i + 1}</span><span class="tag"><b>${w.name}</b><span class="ex">${open(i + 1) ? w.ex : 'Tancat'}</span>${starsHTML(prog.stars[i])}</span>
    </button></li>`).join('')}</ol></div>
    <footer class="foot"><span>${total} de 18 estrelles</span>
      <span class="row"><a class="link" href="index.html">← Tots els jocs</a><button class="link" id="so">So: ${prog.so ? 'sí' : 'no'}</button><button class="link" id="wipe">Esborra el progrés</button></span></footer>`;
  app.querySelectorAll('.world').forEach(b => b.onclick = () => mira(+b.dataset.w));
  $('#so').onclick = () => { prog.so = !prog.so; save(); home(); };
  $('#wipe').onclick = e => {
    if (e.target.dataset.sure) { prog.stars = [0, 0, 0, 0, 0, 0]; save(); home(); }
    else { e.target.dataset.sure = 1; e.target.textContent = 'Segur? Torna a clicar per esborrar-ho tot'; }
  };
}

function head(w, step) {
  return `<div class="top"><button class="link" id="back">← Mapa</button><h2>${w}. ${WORLDS[w - 1].name}</h2>
    <nav class="tabs" aria-label="Passos">${['Mira', 'Prova', 'Repte'].map((s, i) => `<button data-s="${i + 1}"${i + 1 === step ? ' aria-current="step"' : ''}>${s}</button>`).join('')}</nav></div>`;
}
function wire(w) {
  $('#back').onclick = home;
  app.querySelectorAll('.tabs button').forEach(b => b.onclick = () => [mira, prova, repte][b.dataset.s - 1](w));
}
const FORM = `<form id="f" autocomplete="off"><label for="ans" id="q"></label>
  <div class="row"><span id="eq"></span><input id="ans" inputmode="numeric" maxlength="3" autocomplete="off" aria-describedby="msg"><span id="tail"></span><button class="btn" id="ok">Comprova</button></div>
  <p id="msg" role="status"></p></form>`;
const BRAVO = ['Molt bé!', 'Perfecte!', 'Genial!', 'Així es fa!'];
function say(txt, cls) { const m = $('#msg'); if (m) { m.textContent = txt; m.className = cls || ''; } }
function wrong() { const a = $('#ans'); a.classList.remove('shake'); void a.offsetWidth; a.classList.add('shake'); a.select(); beep(false); }

function mira(w) {
  const t = fresh(), W = WORLDS[w - 1];
  if (!W.demo) {
    app.innerHTML = head(w, 1) + `<section class="play"><p class="cap">Ja saps tots els trucs. Ara toca triar el bo per a cada suma.</p>
      <ul class="tricks">${WORLDS.slice(1, 5).map(x => `<li><b>${x.ex}</b> · ${x.tip}</li>`).join('')}</ul>
      <div class="row"><button class="btn" id="go">Ara jo!</button></div></section>`;
    wire(w); $('#go').onclick = () => prova(w); $('#go').focus();
    return;
  }
  let n = 0;
  app.innerHTML = head(w, 1) + `<section class="play"><p class="count">${W.tip}</p><p class="big" id="big"></p><div id="viz"></div><p class="cap" id="cap" aria-live="polite"></p>
    <div class="row"><button class="btn soft" id="again">Torna-ho a veure</button><button class="btn soft" id="other">Un altre exemple</button><button class="btn" id="go">Ara jo!</button></div></section>`;
  wire(w);
  let cur = { on: true };
  async function play() {
    cur.on = false; cur = { on: true }; const mine = cur, p = make(w, ...W.demo[n]);
    $('#big').innerHTML = p.text;
    const done = await demo(p, Viz($('#viz'), p), $('#cap'), { get on() { return mine.on && t.on; } });
    if (done) $('#big').textContent = p.eq;
  }
  $('#again').onclick = play;
  $('#other').onclick = () => { n = (n + 1) % W.demo.length; play(); };
  $('#go').onclick = () => prova(w);
  play();
}

function prova(w) {
  const t = fresh(), list = round(w, 5);
  let i = 0;
  (function show() {
    if (i >= list.length) {
      app.innerHTML = head(w, 2) + `<section class="play"><p class="big">Ja ho tens!</p><p class="cap">Ara sense dibuix i ben de pressa.</p>
        <div class="row"><button class="btn soft" id="more">Vull practicar més</button><button class="btn" id="go">Al repte!</button></div></section>`;
      wire(w); $('#more').onclick = () => prova(w); $('#go').onclick = () => repte(w); $('#go').focus();
      return;
    }
    const p = list[i]; let s = 0, miss = 0, busy = false;
    app.innerHTML = head(w, 2) + `<section class="play"><p class="count">Suma ${i + 1} de ${list.length}</p>
      <p class="big" id="big">${p.text}</p><div id="viz"></div>${FORM}</section>`;
    wire(w);
    const v = Viz($('#viz'), p), inp = $('#ans');
    if (p.pre) { busy = true; v.jump(0).then(() => { busy = false; }); }
    const ask = () => { const st = p.steps[s]; $('#q').textContent = st.hint; $('#eq').textContent = st.eq || ''; $('#tail').textContent = st.tail || ''; inp.value = ''; inp.focus(); miss = 0; };
    ask();
    $('#f').onsubmit = async e => {
      e.preventDefault();
      const val = parseInt(inp.value, 10), st = p.steps[s];
      if (busy || isNaN(val)) return;
      // typing the final result early is right too: show why, then move on
      const skip = val === p.ans && val !== st.ans;
      if (!skip && val !== st.ans) {
        miss++; wrong();
        say(miss >= 2 ? `La resposta és ${st.ans}. Escriu-la per continuar.` : 'Encara no. Torna-ho a provar.', 'bad');
        return;
      }
      busy = true; beep(true); say(skip ? `Sí, fa ${p.ans}! Mira com hi arriba la granota.` : pick(BRAVO), 'good');
      for (let k = s; k < (skip ? p.steps.length : s + 1); k++) {
        if (p.steps[k].jump != null) await v.jump(p.steps[k].jump);
        if (!t.on) return;
      }
      if (skip) { s = p.steps.length - 1; await sleep(900); if (!t.on) return; }
      busy = false;
      if (++s < p.steps.length) return ask();
      $('#big').textContent = p.eq;
      $('#f').outerHTML = `<p class="cap">${pick(BRAVO)}</p><div class="row"><button class="btn" id="next">Següent</button></div>`;
      $('#next').onclick = () => { i++; show(); }; $('#next').focus();
    };
  })();
}

function repte(w) {
  const t = fresh(), q = round(w, 10), res = [], T = WORLDS[w - 1].secs * 1000;
  let i = 0, streak = 0;
  (function show() {
    clearTimeout(timer);
    if (i >= q.length) return fi();
    const p = q[i]; let first = true, hinted = false, done = false, hint = { on: true };
    app.innerHTML = head(w, 3) + `<section class="play">
      <div class="hud"><span class="dots" role="img" aria-label="${res.length} de 10 sumes fetes">${Array.from({ length: 10 }, (_, k) => `<i class="${k < res.length ? (res[k] ? 'ok' : 'slow') : k === res.length && !p.re ? 'now' : ''}"></i>`).join('')}</span>
        <span>${p.re ? 'Repàs' : 'Ratxa: ' + streak}</span></div>
      <div class="timer"><i id="bar"></i></div>
      <p class="big">${p.text}${p.type === 1 ? '' : ' ='}</p>${FORM}
      <p class="cap" id="cap" aria-live="polite" hidden></p><div id="viz" hidden></div></section>`;
    wire(w);
    const inp = $('#ans'), bar = $('#bar');
    $('#q').textContent = 'Escriu el resultat i prem Enter';
    inp.focus();
    void bar.offsetWidth; bar.style.transition = `transform ${T}ms linear`; bar.style.transform = 'scaleX(0)';
    function showTrick() {
      if (hinted) return; hinted = true;
      $('#viz').hidden = false; $('#cap').hidden = false;
      demo(p, Viz($('#viz'), p), $('#cap'), { get on() { return hint.on && t.on; } });
    }
    timer = setTimeout(() => { if (!done && t.on) { say('Cap pressa. Mira el truc i escriu la resposta.'); showTrick(); } }, T);
    $('#f').onsubmit = e => {
      e.preventDefault();
      const val = parseInt(inp.value, 10);
      if (done || isNaN(val)) return;
      if (val !== p.ans) { first = false; wrong(); say('Encara no. Mira el truc i torna-ho a provar.', 'bad'); showTrick(); return; }
      done = true; clearTimeout(timer); bar.style.transition = 'none';
      const clean = first && !hinted;
      if (!p.re) { res.push(clean); streak = clean ? streak + 1 : 0; if (!clean) q.push({ ...p, re: true }); }
      beep(true); say(pick(BRAVO), 'good');
      timer = setTimeout(() => { hint.on = false; if (t.on) { i++; show(); } }, hinted ? 1300 : 600);
    };
  })();
  function fi() {
    const fast = res.filter(Boolean).length, st = starsFor(fast);
    if (st > prog.stars[w - 1]) { prog.stars[w - 1] = st; save(); }
    app.innerHTML = head(w, 3) + `<section class="play result">${starsHTML(st)}
      <p class="big">${fast} de 10</p>
      <p class="cap">${st ? 'sumes fetes de pressa i sense pista.' : 'Encara no hi ha estrella. Torna a mirar el truc i prova-ho un altre cop.'}</p>
      <p class="count">5 sumes: 1 estrella · 7 sumes: 2 estrelles · 9 sumes: 3 estrelles</p>
      <div class="row"><button class="btn soft" id="again">Torna-hi</button>${st && w < 6 ? '<button class="btn" id="next">Món següent</button>' : '<button class="btn" id="map">Torna al mapa</button>'}</div></section>`;
    wire(w);
    $('#again').onclick = () => repte(w);
    if ($('#next')) { $('#next').onclick = () => mira(w + 1); $('#next').focus(); }
    if ($('#map')) { $('#map').onclick = home; $('#map').focus(); }
  }
}

home();
</script>
</body>
