<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>Llums de l'estany</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: a night pond. One centred column; the board is the stage, two fixed canvases paint the sky behind it and the sparks in front.
   The rules are written for a phone held upright; the media queries at the end add what a wider or a sideways screen needs. */
:root {
  --night: #04131C; --night-2: #0A2A3A; --ink: #EAF8F4; --muted: #9EC3C0; --glass: rgb(8 32 44 / 0.72); --edge: rgb(160 230 220 / 0.22);
  --pad: #4FB562; --pad-dark: #2F7F40; --on-pad: #06220D; --sun: #F7C64E; --bad: #FF6B5E;
  --display: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; min-height: 100dvh; padding-inline: 16px; padding-block: 14px 24px; overflow-x: hidden;
  background: radial-gradient(130% 90% at 50% 115%, var(--night-2), var(--night) 65%) var(--night);
  color: var(--ink); font: 500 1.125rem/1.4 var(--body);
}
canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#sky { z-index: 0; }
#fx { z-index: 5; }
#app { position: relative; z-index: 1; max-width: 620px; min-height: calc(100dvh - 38px); margin-inline: auto; display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center; }
h1, h2, .btn, .chip, .status, .banner { font-family: var(--display); }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }

/* the links stay at the top; whatever height is left over is shared above and below the game */
.top { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: auto; }
.link { display: inline-block; background: none; border: 0; padding: 11px 0; margin-block: -7px; color: var(--muted); font-weight: 700; text-decoration: underline; font-size: 1rem; }
.kicker { color: var(--muted); font-weight: 800; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.08em; }
h1 {
  margin: 0; font-size: clamp(2rem, 7vw, 3rem); line-height: 1; font-weight: 800; text-wrap: balance;
  background: linear-gradient(90deg, #7CF5B0, #6FE3FF, #B79CFF, #FF8FD0, #7CF5B0) 0 0 / 200% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent; animation: slide 9s linear infinite;
  filter: drop-shadow(0 0 18px rgb(110 230 255 / 0.35));
}
.hud { width: 100%; max-width: 560px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.chip { min-width: 0; overflow: hidden; text-overflow: ellipsis; background: var(--glass); border: 1px solid var(--edge); border-radius: 999px; padding: 1px 12px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lives { flex: none; display: flex; gap: 8px; }
.lives i { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(#fff 15%, var(--sun) 45%, rgb(247 198 78 / 0) 72%); box-shadow: 0 0 14px 3px rgb(247 198 78 / 0.7); animation: breathe 2.2s ease-in-out infinite; }
.lives i:nth-child(2) { animation-delay: -0.7s; }
.lives i:nth-child(3) { animation-delay: -1.4s; }
.lives i.gone { background: rgb(160 230 220 / 0.16); box-shadow: none; animation: none; }
.status { min-height: 1.25em; font-size: clamp(1.5rem, 5vw, 2rem); line-height: 1.25; font-weight: 800; text-wrap: balance; }
.status.go { color: #7CF5B0; text-shadow: 0 0 22px rgb(124 245 176 / 0.6); }
.status.oops { color: var(--bad); }
.status.pop { animation: pop 0.35s cubic-bezier(0.2, 1.6, 0.4, 1); }

/* the board keeps its size at every level; --n only changes how many tiles share it */
.stage { position: relative; width: min(100%, 560px, max(260px, calc(100dvh - var(--chrome, 280px)))); aspect-ratio: 1; }
.board {
  position: absolute; inset: 0; display: grid; grid-template-columns: repeat(var(--n), 1fr); grid-template-rows: repeat(var(--n), 1fr);
  gap: calc(22px - var(--n) * 2.5px); padding: 14px; border-radius: 30px;
  background: linear-gradient(160deg, rgb(20 70 86 / 0.55), rgb(6 24 34 / 0.75)); border: 1px solid var(--edge);
  box-shadow: 0 24px 60px rgb(0 0 0 / 0.55), inset 0 1px 0 rgb(255 255 255 / 0.12);
}
.tile {
  --c: hsl(var(--h) 100% 62%); position: relative; min-width: 0; border: 0; padding: 0; border-radius: calc(34px - var(--n) * 4px); cursor: default; touch-action: manipulation;
  background: linear-gradient(160deg, hsl(var(--h) 46% 27%), hsl(var(--h) 52% 13%));
  box-shadow: inset 0 1px 0 hsl(var(--h) 80% 70% / 0.4), inset 0 -8px 14px hsl(var(--h) 60% 6% / 0.6), 0 5px 0 hsl(var(--h) 55% 8%), 0 10px 18px rgb(0 0 0 / 0.45);
  transition: transform 0.18s cubic-bezier(0.3, 1.7, 0.5, 1), filter 0.2s, box-shadow 0.18s;
}
.tile::before { content: ""; position: absolute; inset: 8% 10% 54%; border-radius: inherit; background: linear-gradient(rgb(255 255 255 / 0.22), rgb(255 255 255 / 0)); }
.tile::after { content: ""; position: absolute; inset: 0; border-radius: inherit; border: 3px solid var(--c); opacity: 0; }
.board.live .tile { cursor: pointer; }
.board.live .tile:hover { filter: brightness(1.3); }
.board.live .tile:active { transform: translateY(4px) scale(0.97); }
.tile.on, .tile.bad {
  z-index: 2; transform: scale(1.08);
  background: radial-gradient(circle at 50% 38%, #fff 0, hsl(var(--h) 100% 80%) 28%, hsl(var(--h) 98% 56%) 78%);
  box-shadow: 0 0 0 2px hsl(var(--h) 100% 88%), 0 0 26px 5px var(--c), 0 0 80px 18px hsl(var(--h) 100% 60% / 0.55);
}
.tile.on::after { animation: ring 0.55s ease-out; }
.tile.bad {
  animation: shake 0.35s; background: radial-gradient(circle at 50% 38%, #fff 0, #FF9A8A 28%, #F0432F 78%);
  box-shadow: 0 0 0 2px #FFC9C0, 0 0 26px 5px #FF5A45, 0 0 80px 18px rgb(255 80 60 / 0.55);
}
.tile.hint { animation: hint 0.5s ease-in-out 3; }
.tile.enter { animation: enter 0.55s cubic-bezier(0.2, 1.5, 0.4, 1) backwards; animation-delay: calc(var(--d) * 1ms); }
.tile.wave { animation: wave 0.6s ease-in-out; animation-delay: calc(var(--d) * 1ms); }
.board.out .tile { animation: leave 0.4s ease-in forwards; animation-delay: calc(var(--d) * 0.5ms); }
.board.shake { animation: shake 0.35s; }

.panel {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(94%, 400px); z-index: 3;
  display: flex; flex-direction: column; gap: 10px; align-items: center; padding: 14px 14px 16px; border-radius: 26px;
  background: var(--glass); border: 1px solid var(--edge); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  box-shadow: 0 20px 50px rgb(0 0 0 / 0.5); animation: pop 0.4s cubic-bezier(0.2, 1.5, 0.4, 1);
}
.panel h2 { margin: 0; font-size: 1.7rem; line-height: 1.1; font-weight: 800; text-wrap: balance; }
.panel .lead { font-size: 1.05rem; text-wrap: pretty; }
.panel .score { font: 800 2.6rem/1 var(--display); color: var(--sun); font-variant-numeric: tabular-nums; text-shadow: 0 0 24px rgb(247 198 78 / 0.5); }
.panel .rec { color: var(--muted); font-weight: 700; font-size: 1rem; }
.btn {
  border: 0; border-radius: 999px; padding: 0.4em 1.6em; font-size: 1.4rem; font-weight: 800;
  background: var(--pad); color: var(--on-pad); box-shadow: 0 4px 0 var(--pad-dark), 0 0 30px rgb(79 181 98 / 0.55);
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--pad-dark); }
.banner { position: absolute; inset: 0; z-index: 4; display: grid; place-content: center; gap: 4px; pointer-events: none; animation: banner 1.9s ease-in-out both; text-shadow: 0 0 30px rgb(110 230 255 / 0.8), 0 4px 0 rgb(0 0 0 / 0.35); }
.banner b { font-size: clamp(3rem, 14vw, 5.2rem); line-height: 1; font-weight: 800; }
.banner span { font-size: clamp(1.2rem, 5vw, 1.7rem); font-weight: 800; color: #6FE3FF; }

.dots { display: flex; gap: 10px; min-height: 18px; align-items: center; margin-bottom: auto; }
.dots i { width: 16px; height: 16px; border-radius: 50%; background: rgb(160 230 220 / 0.2); transition: transform 0.2s cubic-bezier(0.3, 1.8, 0.5, 1), background 0.15s, box-shadow 0.15s; }
.dots i.ok { background: #7CF5B0; box-shadow: 0 0 12px 2px rgb(124 245 176 / 0.7); transform: scale(1.25); }

/* home: one card per game */
.game { width: 100%; display: flex; flex-direction: column; gap: 2px; align-items: center; padding: 10px 14px 12px; border-radius: 18px; border: 1px solid var(--edge); background: rgb(79 181 98 / 0.16); }
.game:hover { background: rgb(79 181 98 / 0.3); }
.game b { font: 800 1.45rem/1.1 var(--display); color: #7CF5B0; }
.game span { font-size: 0.95rem; line-height: 1.3; }
.game .rec { font-size: 0.9rem; }

/* game 2: the board above the program, with the run buttons pinned to the bottom of the screen; side by side when there is room */
#app.wide { max-width: 940px; }
#app.wide h1 { display: none; }
#mem { display: contents; }
#coet { width: 100%; display: flex; flex-direction: column; gap: 12px; align-items: center; margin-bottom: auto; }
.status.tip { font: 700 1rem/1.35 var(--body); max-width: 54ch; min-height: 2.7em; text-wrap: pretty; scroll-margin-top: 10px; }
/* one row that scrolls sideways, fading at both ends; its padding only leaves room for the focus ring */
.levels { display: flex; gap: 6px; max-width: 100%; padding: 6px 16px; margin-block: -6px; overflow-x: auto; scrollbar-width: none; -webkit-mask-image: linear-gradient(90deg, transparent, #000 16px, #000 calc(100% - 16px), transparent); mask-image: linear-gradient(90deg, transparent, #000 16px, #000 calc(100% - 16px), transparent); }
.levels::-webkit-scrollbar { display: none; }
.levels button { flex: none; width: 44px; height: 44px; border-radius: 50%; padding: 0; border: 1px solid var(--edge); background: var(--glass); font: 800 1rem/1 var(--display); }
.levels button.done { background: #1E6B4A; border-color: #7CF5B0; }
.levels button[aria-current] { background: var(--sun); color: #2A1C00; border-color: #fff; }
.levels button:disabled { opacity: 0.4; cursor: not-allowed; }
.split { width: 100%; display: flex; flex-direction: column; gap: 16px 28px; justify-content: center; align-items: center; }
/* the board is only as tall as its map, so a flat level leaves room for the program */
.split .stage { flex: none; width: min(100%, 480px, max(250px, calc(100dvh - 150px))); aspect-ratio: auto; }
.split .board { position: relative; min-height: 220px; grid-template-rows: repeat(var(--gh), var(--cs)); align-content: center; }
.cell { position: relative; display: grid; place-items: center; min-width: 0; border-radius: max(5px, calc(34px - var(--n) * 4px)); box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.35), 0 4px 0 rgb(0 0 0 / 0.35); }
.cell.cb { background: linear-gradient(160deg, #4C9BEA, #1F4F9A); }
.cell.cg { background: linear-gradient(160deg, #4CCB78, #1C7A3E); }
.cell.cp { background: linear-gradient(160deg, #F57DBC, #A82B72); }
.cell.star::after { content: "★"; font-size: calc(var(--cs) * 0.62); line-height: 1; color: var(--sun); text-shadow: 0 0 12px rgb(247 198 78 / 0.9), 0 2px 0 rgb(0 0 0 / 0.3); animation: breathe 1.6s ease-in-out infinite; }
.rocket { position: absolute; left: 0; top: 0; width: var(--cs); height: var(--cs); z-index: 3; pointer-events: none; transition: transform 0.32s cubic-bezier(0.4, 0, 0.3, 1), opacity 0.3s; filter: drop-shadow(0 0 8px rgb(255 220 120 / 0.8)); }
.rocket svg { display: block; width: 100%; height: 100%; }
.rocket .flame { transform-origin: 32px 48px; animation: flame 0.18s ease-in-out infinite alternate; }
.prog { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 12px; padding: 12px; border-radius: 24px; background: var(--glass); border: 1px solid var(--edge); text-align: left; }
.fn { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
.fname { flex: none; width: 2ch; font: 800 1.3rem/1 var(--display); color: var(--sun); }
.slots, .pal, .brush, .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.slot, .cmd { width: 44px; height: 44px; padding: 0; border-radius: 12px; display: grid; place-items: center; font: 800 1.35rem/1 var(--display); color: #fff; transition: transform 0.12s, box-shadow 0.12s, opacity 0.12s; }
.slot { background: rgb(160 230 220 / 0.08); border: 2px dashed var(--edge); }
.slot.full, .cmd { background: #2A4B5C; border: 2px solid #4D7486; }
.cmd { box-shadow: 0 3px 0 #10242F; }
.cmd:active { transform: translateY(2px); box-shadow: 0 1px 0 #10242F; }
.slot.cb, .cmd.cb, .brush .cb i { background: #2F6FC4; border-color: #8CC2FF; }
.slot.cg, .cmd.cg, .brush .cg i { background: #23904B; border-color: #8CF0AE; }
.slot.cp, .cmd.cp, .brush .cp i { background: #C2408A; border-color: #FFB0DA; }
.slot.sel { outline: 3px solid var(--sun); outline-offset: 2px; }
.slot.run { transform: scale(1.2); border-color: #fff; box-shadow: 0 0 18px 4px var(--sun); z-index: 1; }
.slot.skip { opacity: 0.3; }
.label { margin-bottom: 6px; font-weight: 800; font-size: 0.85rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.brush button { display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 3px 14px 3px 10px; border-radius: 999px; border: 2px solid var(--edge); background: none; font-weight: 800; font-size: 1rem; }
.brush button i { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--muted); }
.brush button[aria-pressed="true"] { border-color: var(--sun); background: rgb(247 198 78 / 0.16); }
.btn.soft { background: #2A4B5C; color: var(--ink); box-shadow: 0 4px 0 #10242F; font-size: 1.1rem; }
.btn.soft:active { box-shadow: 0 1px 0 #10242F; }
.prog .btn { min-height: 44px; font-size: 1.15rem; padding: 0.35em 1em; }
.prog .row .btn { flex: 1 1 auto; padding-inline: 0.5em; font-size: 1.05rem; white-space: nowrap; }
.prog .row { order: 1; position: sticky; bottom: 0; z-index: 2; flex-wrap: nowrap; margin: 0 -12px -12px; padding: 10px 12px 12px; border-top: 1px solid var(--edge); border-radius: 0 0 24px 24px; background: #0A2633; }
.stackline { min-height: 1.7em; font-weight: 700; font-size: 0.95rem; color: var(--muted); }
.stackline b { display: inline-block; margin: 0 2px; padding: 0 8px; border-radius: 8px; background: #2A4B5C; color: var(--sun); font-family: var(--display); }
/* hints: lights run along the tiles to visit next, and the slot to look at pulses */
.cell.trail::before { content: ""; position: absolute; inset: 30%; border-radius: 50%; background: #fff; box-shadow: 0 0 14px 5px #fff; opacity: 0; animation: trail 2s ease-in-out infinite; animation-delay: calc(var(--d) * 1ms); }
.slot { position: relative; }
.slot.next { border: 2px solid var(--sun); animation: beacon 1s ease-in-out infinite; }
.slot.think { border-color: #FFB347; animation: wobble 0.9s ease-in-out infinite; }
.slot.think::after { content: "?"; position: absolute; top: -10px; right: -9px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: #FFB347; color: #2A1C00; font-size: 0.9rem; }
.cmd.glow, .brush button.glow { border-color: var(--sun); animation: beacon 1s ease-in-out infinite; }
/* the vertical menu of sections */
.secs { width: min(100%, 560px); display: flex; flex-direction: column; gap: 10px; }
.sec { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; text-align: left; padding: 12px 16px; border-radius: 20px; border: 1px solid var(--edge); background: var(--glass); }
.sec:not(:disabled):hover { background: rgb(79 181 98 / 0.22); border-color: #7CF5B0; }
.sec:disabled { opacity: 0.5; cursor: not-allowed; }
.sec-n { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--pad); color: var(--on-pad); font: 800 1.5rem/1 var(--display); }
.sec.all .sec-n { background: var(--sun); color: #2A1C00; }
.sec-t { display: flex; flex-direction: column; min-width: 0; }
.sec-t b { font: 800 1.35rem/1.15 var(--display); }
.sec-t span { font-size: 0.95rem; color: var(--muted); }
.sec-p { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; font-weight: 800; font-size: 0.9rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pips { display: flex; gap: 3px; }
.pips i { width: 7px; height: 7px; border-radius: 50%; background: rgb(160 230 220 / 0.2); }
.pips i.ok { background: var(--sun); }
@keyframes trail { 0%, 55%, 100% { opacity: 0; transform: scale(0.4); } 18% { opacity: 0.95; transform: scale(1); } }
@keyframes beacon { 50% { box-shadow: 0 0 16px 5px var(--sun); } }
@keyframes wobble { 25% { transform: rotate(-7deg); } 75% { transform: rotate(7deg); } }
@keyframes flame { to { transform: scaleY(0.6); } }

@keyframes slide { to { background-position: -200% 0; } }
@keyframes breathe { 50% { transform: scale(0.9); } }
@keyframes pop { from { transform: scale(0.6); opacity: 0; } }
.panel { animation-name: panel; }
@keyframes panel { from { transform: translate(-50%, -50%) scale(0.7); opacity: 0; } }
@keyframes ring { from { opacity: 0.9; transform: scale(1); } to { opacity: 0; transform: scale(1.55); } }
@keyframes shake { 20% { transform: translateX(-9px); } 50% { transform: translateX(8px); } 80% { transform: translateX(-5px); } }
@keyframes hint { 50% { filter: brightness(2.6) saturate(1.4); transform: scale(1.1); box-shadow: 0 0 0 3px #fff, 0 0 30px 6px var(--c); } }
@keyframes enter { from { transform: scale(0) rotate(-25deg); opacity: 0; } }
@keyframes leave { to { transform: scale(0) rotate(30deg); opacity: 0; } }
@keyframes wave { 50% { transform: translateY(-9px) scale(1.06); filter: brightness(2.1) saturate(1.5); } }
@keyframes banner { 0% { transform: scale(0.3); opacity: 0; } 18% { transform: scale(1.12); opacity: 1; } 28%, 78% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
/* a tablet or a laptop: bigger type, and the rocket's board and program side by side */
@media (min-width: 700px), (min-width: 560px) and (orientation: landscape) {
  .status.tip { font-size: 1.1rem; }
  .split { flex-direction: row; }
  .split .stage { width: min(480px, max(250px, calc(100dvh - var(--chrome2, 330px))), calc(100% - 328px)); aspect-ratio: 1; }
  .split .board { position: absolute; min-height: 0; }
  .prog { flex: 1 1 300px; width: auto; max-width: 420px; padding: 16px; }
  .slot, .cmd { width: 46px; height: 46px; }
  .prog .row .btn { flex: none; padding-inline: 1em; font-size: 1.15rem; }
  .prog .row { order: 0; position: static; flex-wrap: wrap; margin: 0; padding: 0; border: 0; border-radius: 0; background: none; }
}
@media (min-width: 700px) {
  :root { --chrome: 310px; }
  #app.wide h1 { display: block; }
  .chip { padding-inline: 14px; }
  .panel { width: min(88%, 400px); gap: 12px; padding: 20px 20px 22px; }
  .game span { font-size: 0.98rem; line-height: inherit; }
}
/* with a mouse the small buttons can be smaller, which keeps the rocket game on one laptop screen */
@media (min-width: 700px) and (pointer: fine) {
  .levels button { width: 34px; height: 34px; }
  .brush button, .prog .btn { min-height: 0; }
}
/* a short window: the rocket game drops the big title and gives that height to the board */
@media (max-height: 700px) {
  :root { --chrome2: 270px; }
  body { padding-bottom: 14px; }
  #app.wide h1 { display: none; }
}
/* a phone on its side: the memory board takes the whole height on the right, the rest stacks on the left; the rocket's board follows the program as it scrolls */
@media (orientation: landscape) and (max-height: 520px) {
  .split { align-items: flex-start; }
  .split .stage { position: sticky; top: 8px; }
  h1 { font-size: 2rem; }
  .status:not(.tip) { font-size: 1.5rem; }
  #app:not(.wide) { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto 1fr repeat(4, auto) 1fr; gap: 10px 24px; justify-items: center; max-width: 900px; }
  #app:not(.wide) .top { grid-area: 1 / 1; margin: 0; }
  #app:not(.wide) header { grid-area: 3 / 1; }
  #app:not(.wide) .hud { grid-area: 4 / 1; }
  #app:not(.wide) .status { grid-area: 5 / 1; }
  #app:not(.wide) .dots { grid-area: 6 / 1; margin: 0; }
  #app:not(.wide) .stage { grid-area: 1 / 2 / -1 / 2; width: min(calc(100dvh - 38px), 50vw); }
}
@media (prefers-reduced-motion: reduce) {
  h1, .lives i, .cell.star::after, .rocket .flame, .slot.next, .slot.think, .cmd.glow, .brush button.glow, .tile.enter, .tile.wave, .tile.bad, .board.shake, .board.out .tile, .panel, .status.pop, .tile.on::after { animation: none; }
  .tile { transition: none; }
  .cell.trail::before { animation: none; opacity: 0.85; }
  .slot.next, .cmd.glow, .brush button.glow { box-shadow: 0 0 16px 5px var(--sun); }
  .banner { animation: bannerCalm 1.9s both; }
  @keyframes bannerCalm { 0%, 100% { opacity: 0; } 15%, 85% { opacity: 1; } }
}
</style>

<canvas id="sky" aria-hidden="true"></canvas>
<main id="app">
  <div class="top"><span><a class="link" id="toG" href="index.html">← Tots els jocs</a><button class="link" id="toM" hidden>← Jocs</button></span><button class="link" id="so"></button></div>

const GRIDS = [3, 4, 5, 6], MINLEN = 2, MAXLEN = 5, LIVES = 3;
// a sequence never lights the same tile twice
function makeSeq(cells, len, rand = Math.random) {
  const pool = Array.from({ length: cells }, (_, i) => i), out = [];
  while (out.length < len) out.push(pool.splice(Math.floor(rand() * pool.length), 1)[0]);
  return out;
}
const begin = () => ({ lvl: 0, len: MINLEN, lives: LIVES, score: 0, up: false, won: false, over: false });
// one round played: a miss costs a life and keeps the length; a hit grows the series, and after MAXLEN the grid gets finer
function step(s, ok) {
  if (!ok) { const lives = s.lives - 1; return { ...s, lives, up: false, over: lives <= 0 }; }
  const score = s.score + s.len * (s.lvl + 1) * 10;
  if (s.len < MAXLEN) return { ...s, score, len: s.len + 1, up: false };
  if (s.lvl === GRIDS.length - 1) return { ...s, score, up: false, won: true, over: true };
  return { ...s, score, lvl: s.lvl + 1, len: MINLEN, up: true };
}

const noteOf = (r, c, n) => { const k = n - 1 - r + c; return 261.63 * 2 ** ((12 * Math.floor(k / 5) + PENTA[k % 5]) / 12); };

    if (!s.up) { say(pick(BRAVO), 'go'); chime([659, 784, 1047]); await sleep(1100); if (!t.on) return; continue; }
    // five lights done: same board, smaller tiles
    say('Nivell superat!', 'go'); chime([523, 659, 784, 1047, 1319]); FX.celebrate(); FX.mood(s.lvl);
    await sleep(1500); if (!t.on) return;
    dotsEl.replaceChildren();
    const n = GRIDS[s.lvl];
    stage.insertAdjacentHTML('beforeend', `<div class="banner"><b>Nivell ${s.lvl + 1}</b><span>${n} × ${n} · quadres més petits!</span></div>`);
    const ban = stage.lastElementChild; setTimeout(() => ban.remove(), 1950);
    const c = stage.getBoundingClientRect(); FX.ring(c.left + c.width / 2, c.top + c.height / 2, hueOf(0, n - 1, n), 30, c.width * 0.75, 1);
    await build(n, t); if (!t.on) return;
    await sleep(900); if (!t.on) return;
  }
}

/* ---------- game 2: the rocket follows the functions the child writes ---------- */
const OPS = { f: ['↑', 'Endavant'], L: ['↶', "Gira a l'esquerra"], R: ['↷', 'Gira a la dreta'], 1: ['F1', 'Crida F1'], 2: ['F2', 'Crida F2'] };
const CNAME = { b: 'blau', g: 'verd', p: 'rosa' };
const ROCKET = `<svg viewBox="0 0 64 64" aria-hidden="true"><path class="flame" d="M25 48 Q32 68 39 48Z" fill="#F7C64E"/><path d="M22 38 L11 52 L24 47Z M42 38 L53 52 L40 47Z" fill="#FF6B9A"/><path d="M32 3 C45 14 46 34 42 48 H22 C18 34 19 14 32 3Z" fill="#EAF8F4" stroke="#0A2A3A" stroke-width="2"/><circle cx="32" cy="24" r="6.5" fill="#6FE3FF" stroke="#0A2A3A" stroke-width="2"/></svg>`;
const STEP = 430, HURRAY = ['Molt bé!', 'Perfecte!', 'Genial!', 'Bon programa!', 'Enlairament perfecte!'];
// set while the rocket game is up: puts the rocket back on its tile after a resize
let replace = null;
addEventListener('resize', () => replace && replace());

const secOpen = s => s === 0 || prog.secs[s - 1] >= 10;
function seccions() {
  fresh(); pickFn = null; show('coet', 'Joc 2 · Programació'); FX.mood(0); back = menu; $('#toM').textContent = '← Jocs';
  const root = $('#coet');
  root.innerHTML = `<p class="status tip">Tria una secció. A cada una el coet aprèn un truc nou.</p>
    <nav class="secs" aria-label="Seccions">${SECTIONS.map((s, i) => { const n = prog.secs[i]; return `<button class="sec${n >= 10 ? ' all' : ''}" data-s="${i}"${secOpen(i) ? '' : ' disabled'}>
      <span class="sec-n">${i + 1}</span><span class="sec-t"><b>${s.name}</b><span>${secOpen(i) ? s.sub : 'Acaba la secció anterior per obrir-la'}</span></span>
      <span class="sec-p"><span class="pips">${Array.from({ length: 10 }, (_, k) => `<i${k < n ? ' class="ok"' : ''}></i>`).join('')}</span>${n} de 10</span></button>`; }).join('')}</nav>`;
  root.querySelector('.secs').onclick = e => { const b = e.target.closest('.sec'); if (b && !b.disabled) coet(+b.dataset.s, Math.min(prog.secs[+b.dataset.s], 9)); };
  root.querySelector('.sec:not(:disabled)').focus({ preventScroll: true });
}

function coet(sec, idx) {
  const t = fresh(); pickFn = null; show('coet', `Secció ${sec + 1} · ${SECTIONS[sec].name}`); FX.mood(sec % 4); back = seccions; $('#toM').textContent = '← Seccions';
  const root = $('#coet'), lv = LEVELS[sec * 10 + idx], g = readMap(lv.map), size = Math.max(g.w, g.h), ox = Math.floor((size - g.w) / 2);
  const code = lv.slots.map(k => Array(k).fill(null));
  // the reference route, tile by tile, with the stars picked up by then: a hint lights up what comes next
  const route = [{ x: lv.start[0], y: lv.start[1], got: 0 }];
  for (const st of trace(lv, lv.ref).steps) if (!st.skip && lv.ref[st.f][st.i].op === 'f') route.push({ x: st.x, y: st.y, got: route[route.length - 1].got + (st.star ? 1 : 0) });
  let sel = [0, 0], brush = '', job = null, ang = 0, at = [0, 0], got = 0, geo = { x: 0, y: 0, pitch: 0 };
  // hint state: how many were asked, the slot being pointed at, the order given away after asking three times at the same spot
  let asks = 0, slow = false, mark = null, reveal = null, stuck = ['', 0];
  root.innerHTML = `<div class="hud"><span class="chip">Nivell ${idx + 1} · ${lv.name}</span><span class="chip" id="cstars"></span></div>
    <nav class="levels" aria-label="Nivells">${SECTIONS[sec].levels.map((_, i) => `<button data-n="${i}" class="${i < prog.secs[sec] ? 'done' : ''}"${i === idx ? ' aria-current="true"' : ''}${i > prog.secs[sec] ? ' disabled title="Supera el nivell anterior"' : ''}>${i + 1}</button>`).join('')}</nav>
    <p class="status tip" id="ctip" role="status" aria-live="polite"></p>
    <div class="split"><div class="stage" id="cstage"><div class="board" id="cboard" style="--n:${size};--gh:${g.h}"></div></div>
    <div class="prog" id="prog"><div id="fns"></div>
      <div><p class="label">Ordres</p><div class="pal" id="pal">${[...lv.cmds].map(op => `<button class="cmd" data-op="${op}" aria-label="${OPS[op][1]}">${OPS[op][0]}</button>`).join('')}<button class="cmd" data-op="x" aria-label="Buida la casella">✕</button></div></div>
      ${lv.conds ? `<div><p class="label">Fes-la només si el coet és damunt de…</p><div class="brush">${['', ...lv.conds].map(c => `<button data-c="${c}" class="${c ? 'c' + c : ''}"><i></i>${c ? CNAME[c] : 'sempre'}</button>`).join('')}</div></div>` : ''}
      <div class="row"><button class="btn" id="runb">▶ Engega</button><button class="btn soft" id="clr">Esborra</button><button class="btn soft" id="hintb">Pista</button></div>
      <p class="stackline" id="stk"></p></div></div>`;
  const cb = $('#cboard'), runb = $('#runb');
  // the row of levels scrolls sideways on a phone: start with this level in the middle
  { const nav = root.querySelector('.levels'), a = nav.getBoundingClientRect(), c = nav.querySelector('[aria-current]').getBoundingClientRect(); nav.scrollLeft += c.left - a.left - (a.width - c.width) / 2; }
  const tip = (txt, cls) => { const e = $('#ctip'); e.className = 'status tip' + (cls ? ' ' + cls : ''); e.textContent = txt; };
  // on a phone the program can push the tip and the board off screen: bring them back when something is about to happen there
  function look() {
    const a = $('#ctip').getBoundingClientRect(), b = cb.getBoundingClientRect(), bar = runb.parentElement, under = getComputedStyle(bar).position === 'sticky' ? bar.offsetHeight : 0;
    if (a.top < 0 || b.bottom > innerHeight - under) $('#ctip').scrollIntoView({ behavior: RM ? 'auto' : 'smooth' });
  }
  const rk = () => cb.querySelector('.rocket');
  const mid = e => { const r = e.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width }; };
  function put(x, y, extra = '') { at = [x, y]; rk().style.transform = `translate(${geo.x + x * geo.pitch}px, ${geo.y + y * geo.pitch}px) rotate(${ang}deg)${extra}`; }
  function measure() {
    const cs = getComputedStyle(cb), pad = parseFloat(cs.paddingLeft), gap = parseFloat(cs.columnGap), pitch = (cb.clientWidth - 2 * pad + gap) / size;
    cb.style.setProperty('--cs', pitch - gap + 'px');
    // the stylesheet centres the rows: read where the map landed from one of its tiles
    const c = cb.querySelector('.cell'), [x, y] = c.dataset.k.split(',').map(Number);
    geo = { x: c.offsetLeft - x * pitch, y: c.offsetTop - y * pitch, pitch };
  }
  const still = fn => { rk().style.transition = 'none'; fn(); void rk().offsetWidth; rk().style.transition = ''; };
  const count = k => { got = k; $('#cstars').textContent = `★ ${k} de ${g.stars.size}`; };
  // the board as the level starts: every star back, no hint lights, the rocket on its first tile
  function setup() {
    cb.innerHTML = [...g.cells].map(([k, c]) => { const [x, y] = k.split(',').map(Number); return `<div class="cell c${c}${g.stars.has(k) ? ' star' : ''}" data-k="${k}" style="grid-column:${x + ox + 1};grid-row:${y + 1}"></div>`; }).join('') + `<div class="rocket">${ROCKET}</div>`;
    measure(); ang = lv.start[2] * 90; still(() => put(lv.start[0], lv.start[1])); count(0); $('#stk').textContent = '';
  }
  replace = () => { measure(); still(() => put(at[0], at[1])); };
  function drawCode() {
    $('#fns').innerHTML = code.map((fn, f) => `<div class="fn"><span class="fname">F${f + 1}</span><div class="slots">${fn.map((s, i) =>
      `<button class="slot${s ? ' full' : ''}${s && s.c ? ' c' + s.c : ''}${sel[0] === f && sel[1] === i ? ' sel' : ''}${mark && mark.f === f && mark.i === i ? ' ' + mark.kind : ''}" data-f="${f}" data-i="${i}" aria-label="F${f + 1}, casella ${i + 1}: ${s ? OPS[s.op][1] + (s.c ? ', només al ' + CNAME[s.c] : '') : 'buida'}">${s ? OPS[s.op][0] : ''}</button>`).join('')}</div></div>`).join('');
    root.querySelectorAll('.cmd').forEach(b => { b.className = 'cmd' + (brush && b.dataset.op !== 'x' ? ' c' + brush : '') + (reveal && reveal.op === b.dataset.op ? ' glow' : ''); });
    root.querySelectorAll('.brush button').forEach(b => { b.setAttribute('aria-pressed', b.dataset.c === brush); b.classList.toggle('glow', !!reveal && (reveal.c || '') === b.dataset.c); });
  }
  function stop() { if (job) job.on = false; job = null; runb.textContent = '▶ Engega'; setup(); drawCode(); }
  const launch = () => { const me = job = { on: true }; runb.textContent = '■ Atura'; return me; };
  function sink() {
    const p = mid(rk()); FX.burst(p.x, p.y, 200, 24, 150); FX.ring(p.x, p.y, 200, 6, p.w);
    put(at[0], at[1], ' scale(0.1)'); rk().style.opacity = 0; tone(150, 0, 0.45, 0.16, 'triangle');
  }

  // plays the steps of a trace on the board; false if the run was stopped on the way
  async function fly(steps, me, pace) {
    let k = 0;
    for (const st of steps) {
      const el = root.querySelector(`.slot[data-f="${st.f}"][data-i="${st.i}"]`), op = code[st.f][st.i].op;
      el.classList.add(st.skip ? 'skip' : 'run');
      if (!st.skip) {
        $('#stk').innerHTML = 'Funcions en marxa: ' + st.stack.slice(0, 9).map(f => `<b>F${f + 1}</b>`).join('▸') + (st.stack.length > 9 ? '…' : '');
        if (op === 'f') { const p = mid(rk()); FX.burst(p.x, p.y, 38, 8, 70, 0); put(st.x, st.y); tone(330, 0, 0.12, 0.06); }
        else if (st.turn) { ang += 90 * st.turn; put(st.x, st.y); tone(440, 0, 0.1, 0.05); }
        else tone(660, 0, 0.12, 0.06);
      }
      // a program that is still going after 60 steps is probably looping: hurry it along
      await sleep(++k > 60 ? 150 : st.skip ? Math.min(240, pace) : pace); if (!me.on || !t.on) return false;
      if (st.star) {
        const c = cb.querySelector(`[data-k="${st.star}"]`), p = mid(c);
        c.classList.remove('star'); count(got + 1); FX.burst(p.x, p.y, 48, 26, 190); FX.ring(p.x, p.y, 48, 8, p.w * 1.2); tone(1047, 0, 0.3, 0.1);
      }
      el.classList.remove('run', 'skip');
    }
    return true;
  }

  async function go() {
    const r = trace(lv, code, 150);
    if (!r.steps.length) return tip('Posa alguna ordre a F1 i torna a prémer Engega.', 'oops');
    mark = reveal = null; setup(); drawCode(); root.querySelector('.slot.sel')?.classList.remove('sel');
    const me = launch(), alive = () => me.on && t.on;
    tip(lv.tip); look(); tone(523, 0, 0.15);
    // after asking for a hint the rocket flies slower, so each order can be followed
    if (!await fly(r.steps, me, slow ? 700 : STEP)) return;
    if (r.end === 'win') {
      runb.disabled = true; ang += 360; put(at[0], at[1]);
      if (idx + 1 > prog.secs[sec]) { prog.secs[sec] = idx + 1; save(); }
      const end = idx === 9, last = end && sec === SECTIONS.length - 1;
      chime([523, 659, 784, 1047, 1319]); FX.celebrate(end ? 16 : 8);
      await sleep(900); if (!alive()) return;
      panel($('#cstage'), `<h2>${last ? 'Ets programador de coets!' : end ? 'Secció superada!' : pick(HURRAY)}</h2>
        <p class="lead">${last ? 'Has fet servir funcions, colors i recursivitat, com els programadors de veritat.' : end ? `Has obert la secció ${sec + 2}: ${SECTIONS[sec + 1].name}.` : `Nivell ${idx + 1} superat amb ${code.flat().filter(Boolean).length} ordres.`}</p>
        <button class="btn" id="nx">${last ? 'Torna a les seccions' : end ? 'Secció següent' : 'Nivell següent'}</button>`);
      $('#nx').onclick = () => last ? seccions() : end ? coet(sec + 1, 0) : coet(sec, idx + 1);
      return;
    }
    if (r.end === 'fall') sink(); else tone(150, 0, 0.45, 0.16, 'triangle');
    tip({ fall: "Xof! El coet ha caigut a l'aigua. Canvia les ordres i torna-hi.", end: "S'han acabat les ordres i encara queden estrelles.", fuel: "El coet s'ha quedat sense combustible: fa voltes sense arribar enlloc." }[r.end] + ' Si no saps com seguir, prem Pista.', 'oops');
    await sleep(1500); if (!alive()) return;
    stop();
  }

  // shortest way over the tiles from the rocket to a star still on the board, for a rocket that left the reference route
  function wayToStar() {
    const seen = new Map([[at.join(','), null]]), queue = [at.join(',')];
    while (queue.length) {
      const k = queue.shift(), [x, y] = k.split(',').map(Number);
      if (k !== at.join(',') && cb.querySelector(`[data-k="${k}"]`).classList.contains('star')) { const out = []; for (let c = k; seen.get(c) !== null; c = seen.get(c)) out.unshift(c); return out; }
      for (let d = 0; d < 4; d++) { const n = (x + DX[d]) + ',' + (y + DY[d]); if (g.cells.has(n) && !seen.has(n)) { seen.set(n, k); queue.push(n); } }
    }
    return [];
  }
  // A hint replays, slowly, what is written so far and leaves the rocket where the program leaves it. Then lights run along
  // the tiles to visit next, and the first slot that is empty or differs from the reference program is marked.
  async function coach() {
    slow = true;
    const hint = lv.hints[asks++ % lv.hints.length], r = trace(lv, code, 150);
    if (r.end === 'win') return tip('Aquest programa ja funciona! Prem Engega i mira com vola.', 'go');
    let tgt = [0, 0];
    lv.ref.some((fn, f) => fn.some((b, i) => { const a = code[f][i]; return (!a || a.op !== b.op || (a.c || null) !== b.c) && (tgt = [f, i]); }));
    const filled = !!code[tgt[0]][tgt[1]], key = tgt + '|' + filled, steps = r.steps.slice(0, 40), fell = r.end === 'fall';
    stuck = [key, stuck[0] === key ? stuck[1] + 1 : 1];
    mark = reveal = null; setup(); drawCode(); root.querySelector('.slot.sel')?.classList.remove('sel');
    if (steps.length) {
      const me = launch(); tip('Mirem què fa el teu programa…'); look();
      if (!await fly(steps, me, 700)) return;
      if (fell) {
        // show the splash, then put the rocket back on the last tile it stood on
        const prev = steps[steps.length - 2];
        sink(); await sleep(900); if (!me.on || !t.on) return;
        rk().style.opacity = ''; put(prev ? prev.x : lv.start[0], prev ? prev.y : lv.start[1]);
      }
      job = null; runb.textContent = '▶ Engega';
    }
    const j = route.findIndex(c => c.x === at[0] && c.y === at[1] && c.got === got);
    let next = j < 0 ? wayToStar() : route.slice(j + 1).map(c => c.x + ',' + c.y);
    if (j >= 0) { const star = route.slice(j + 1).findIndex(c => c.got > got); next = next.slice(0, star < 0 ? next.length : star + 1); }
    next.slice(0, 8).forEach((k, n) => { const c = cb.querySelector(`[data-k="${k}"]`); c.classList.add('trail'); c.style.setProperty('--d', n * 220); });
    mark = { f: tgt[0], i: tgt[1], kind: filled ? 'think' : 'next' }; sel = tgt;
    if (stuck[1] >= 3) reveal = lv.ref[tgt[0]][tgt[1]];
    drawCode(); look();
    tip((fell ? 'Xof! Aquí el coet cau. ' : r.end === 'fuel' ? 'El coet fa voltes sense arribar enlloc. ' : steps.length ? 'Fins aquí arriba el teu programa. ' : '')
      + (reveal ? "L'ordre que brilla a baix és la que va a la casella marcada. " : filled ? 'Repassa la casella marcada amb «?» i segueix el camí de llums. ' : 'Segueix el camí de llums i continua a la casella que brilla. ') + hint);
  }

  $('#prog').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b === runb) return job ? stop() : go();
    if (job) return;
    if (b.id === 'hintb') return coach();
    if (b.classList.contains('slot')) sel = [+b.dataset.f, +b.dataset.i];
    else if ('c' in b.dataset) brush = b.dataset.c;
    else if (b.dataset.op === 'x') code[sel[0]][sel[1]] = null;
    else if (b.dataset.op) {
      code[sel[0]][sel[1]] = { op: b.dataset.op, c: brush || null }; brush = ''; tone(784, 0, 0.08, 0.05);
      if (sel[1] + 1 < code[sel[0]].length) sel = [sel[0], sel[1] + 1];
    }
    else if (b.id === 'clr') { code.forEach(fn => fn.fill(null)); sel = [0, 0]; }
    // any change to the program clears the hint marks; the lights on the board stay until the next flight
    if (!('c' in b.dataset)) mark = reveal = null;
    drawCode();
  };
  root.querySelector('.levels').onclick = e => { const b = e.target.closest('button'); if (b && !b.disabled) coet(sec, +b.dataset.n); };
  tip(lv.tip); setup(); drawCode();
}

soBtn();
// the page of all games links straight to the rocket game
location.hash === '#coet' ? seccions() : menu();
</script>
</body>
