<title>L'àbac xinès</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: the night pond of the other games. One centred column: the operation, the abacus as the stage, the buttons under it.
   Every size of the abacus hangs from --u, the height of one bead, so it shrinks with the screen without any measuring in the script.
   The rules are written for a phone held upright; the media queries at the end add what a wider or a sideways screen needs. */
:root {
  --night: #04131C; --night-2: #0A2A3A; --ink: #EAF8F4; --muted: #9EC3C0; --glass: rgb(8 32 44 / 0.72); --edge: rgb(160 230 220 / 0.22);
  --pad: #4FB562; --pad-dark: #2F7F40; --on-pad: #06220D; --sun: #F7C64E; --bad: #FF6B5E;
  --display: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; min-height: 100dvh; padding-inline: 16px; padding-block: 14px 24px; overflow-x: hidden;
  background: radial-gradient(130% 90% at 50% 115%, var(--night-2), var(--night) 65%) var(--night);
  color: var(--ink); font: 500 1.125rem/1.4 var(--body);
}
canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#sky { z-index: 0; }
#fx { z-index: 5; }
#app { position: relative; z-index: 1; max-width: 620px; min-height: calc(100dvh - 38px); margin-inline: auto; display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center; }
h1, h2, .btn, .chip, .status, .task { font-family: var(--display); }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }

.top { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.link { display: inline-block; background: none; border: 0; padding: 11px 0; margin-block: -7px; color: var(--muted); font-weight: 700; text-decoration: underline; font-size: 1rem; }
.kicker { color: var(--muted); font-weight: 800; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.08em; }
h1 {
  margin: 0; font-size: clamp(2rem, 7vw, 3rem); line-height: 1; font-weight: 800; text-wrap: balance;
  background: linear-gradient(90deg, #7CF5B0, #6FE3FF, #B79CFF, #FF8FD0, #7CF5B0) 0 0 / 200% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent; animation: slide 9s linear infinite;
  filter: drop-shadow(0 0 18px rgb(110 230 255 / 0.35));
}
/* inside a level the big title gives its height to the abacus */
#app.wide h1 { display: none; }
#joc { width: 100%; display: flex; flex-direction: column; gap: 12px; align-items: center; margin-bottom: auto; }
.hud { width: 100%; max-width: 560px; display: flex; justify-content: center; align-items: center; gap: 8px; }
.chip { min-width: 0; overflow: hidden; text-overflow: ellipsis; background: var(--glass); border: 1px solid var(--edge); border-radius: 999px; padding: 1px 12px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.status { font-weight: 800; }
.status.tip { font: 700 1rem/1.35 var(--body); max-width: 54ch; min-height: 2.7em; text-wrap: pretty; scroll-margin-top: 10px; }
.status.go { color: #7CF5B0; text-shadow: 0 0 22px rgb(124 245 176 / 0.6); }
.status.oops { color: var(--bad); }
/* one row that scrolls sideways, fading at both ends; its padding only leaves room for the focus ring */
.levels { display: flex; gap: 6px; max-width: 100%; padding: 6px 16px; margin-block: -6px; overflow-x: auto; scrollbar-width: none; -webkit-mask-image: linear-gradient(90deg, transparent, #000 16px, #000 calc(100% - 16px), transparent); mask-image: linear-gradient(90deg, transparent, #000 16px, #000 calc(100% - 16px), transparent); }
.levels::-webkit-scrollbar { display: none; }
.levels button { flex: none; width: 44px; height: 44px; border-radius: 50%; padding: 0; border: 1px solid var(--edge); background: var(--glass); font: 800 1rem/1 var(--display); }
.levels button.done { background: #1E6B4A; border-color: #7CF5B0; }
.levels button[aria-current] { background: var(--sun); color: #2A1C00; border-color: #fff; }
.levels button:disabled { opacity: 0.4; cursor: not-allowed; }

/* the operation to solve, as big as the screen allows */
.task { font-size: clamp(1.7rem, 8vw, 2.5rem); line-height: 1.1; font-weight: 800; font-variant-numeric: tabular-nums; text-wrap: balance; }
.task b { color: var(--sun); text-shadow: 0 0 22px rgb(247 198 78 / 0.55); }

/* the abacus: a rosewood frame with a gold inlay around a dark well. Each column is a rod; the beads are buttons placed by --s,
   the slot they sit in, counted from the top of their deck. A bead that counts is lit like a lantern. */
.stage { position: relative; width: 100%; display: grid; justify-items: center; }
.abacus {
  --u: clamp(22px, min(7.6vw, calc((100dvh - 330px) / 8.6)), 44px);
  position: relative; width: min(100%, calc(var(--n) * var(--u) * 2.5 + 28px)); padding: 14px 14px 8px; border-radius: 26px;
  background: linear-gradient(160deg, #9A5A36, #5A2A18 55%, #35160D); border: 1px solid rgb(255 214 160 / 0.4);
  box-shadow: 0 24px 60px rgb(0 0 0 / 0.55), inset 0 1px 0 rgb(255 255 255 / 0.3), inset 0 -6px 12px rgb(0 0 0 / 0.35);
}
.abacus::before { content: ""; position: absolute; inset: 5px; border-radius: 21px; border: 1.5px solid rgb(247 198 78 / 0.45); pointer-events: none; }
.well { display: grid; grid-template-columns: repeat(var(--n), 1fr); border-radius: 12px; overflow: hidden; background: linear-gradient(#051821, #0B2C3C); box-shadow: inset 0 5px 16px rgb(0 0 0 / 0.75), 0 1px 0 rgb(255 255 255 / 0.18); }
.rod { --c: hsl(var(--h) 100% 62%); position: relative; min-width: 0; display: flex; flex-direction: column; }
.rod::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; margin-left: -2px; background: linear-gradient(90deg, #6E5220, #F7C64E 45%, #6E5220); }
.deck { position: relative; }
.deck.hi { height: calc(var(--u) * 2 + 8px); }
.deck.lo { height: calc(var(--u) * 6 + 8px); }
.beam { position: relative; z-index: 1; height: 12px; background: linear-gradient(#C07A48, #6B321C); box-shadow: 0 2px 4px rgb(0 0 0 / 0.5), inset 0 1px 0 rgb(255 255 255 / 0.35); }
.beam::after { content: ""; position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: var(--sun); box-shadow: 0 0 6px var(--sun); }
.bead {
  position: absolute; left: 50%; top: 5.5px; width: min(86%, calc(var(--u) * 2.15)); height: calc(var(--u) - 3px); padding: 0; border: 0; border-radius: 50%;
  transform: translate(-50%, calc(var(--s) * var(--u))); transition: transform 0.2s cubic-bezier(0.3, 1.5, 0.5, 1), box-shadow 0.2s; touch-action: manipulation;
  background: radial-gradient(ellipse at 50% 28%, hsl(var(--h) 45% 46%), hsl(var(--h) 50% 24%) 55%, hsl(var(--h) 55% 12%));
  box-shadow: inset 0 -3px 5px rgb(0 0 0 / 0.45), 0 2px 3px rgb(0 0 0 / 0.5);
}
.bead::before { content: ""; position: absolute; inset: 12% 22% 56%; border-radius: 50%; background: linear-gradient(rgb(255 255 255 / 0.5), rgb(255 255 255 / 0)); }
/* the heaven bead is amber on every rod: it is the one worth five */
.deck.hi .bead { --h: 44; --c: hsl(44 100% 62%); }
.bead.on {
  background: radial-gradient(ellipse at 50% 32%, #fff 0, hsl(var(--h) 100% 80%) 26%, hsl(var(--h) 98% 56%) 80%);
  box-shadow: 0 0 0 1.5px hsl(var(--h) 100% 88%), 0 0 16px 3px var(--c), 0 0 34px 8px hsl(var(--h) 100% 60% / 0.4);
}
.abacus.locked .bead { cursor: default; }
.bead.wave { animation: lit 0.6s ease-in-out; animation-delay: calc(var(--d) * 1ms); }
.abacus.shake { animation: shake 0.35s; }
/* under each rod: what the column shows (only while the level allows it) and the place it stands for */
.foot { display: grid; grid-template-columns: repeat(var(--n), 1fr); padding-top: 5px; }
.foot span { display: flex; flex-direction: column; align-items: center; min-width: 0; }
.foot b { font: 800 1.5rem/1.05 var(--display); color: hsl(var(--h) 100% 78%); font-variant-numeric: tabular-nums; }
.foot b:empty { display: none; }
.foot b.over { color: var(--bad); }
.foot i { font-style: normal; font-weight: 800; font-size: 0.75rem; line-height: 1.5; letter-spacing: 0.06em; color: rgb(255 214 160 / 0.85); }
/* hints: first the column to look at glows, then the bead to touch turns gold with the way it has to go */
.rod.glow { animation: column 1s ease-in-out infinite; }
.bead.next { background: radial-gradient(ellipse at 50% 30%, #fff, var(--sun) 62%); box-shadow: 0 0 0 2px #fff, 0 0 16px 5px var(--sun); animation: lit 1s ease-in-out infinite; z-index: 1; }
.bead.next::after { content: attr(data-a); position: absolute; inset: 0; display: grid; place-items: center; color: #2A1C00; font: 800 0.8rem/1 var(--display); }

.acts, .opts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.btn {
  border: 0; border-radius: 999px; padding: 0.4em 1.6em; font-size: 1.4rem; font-weight: 800;
  background: var(--pad); color: var(--on-pad); box-shadow: 0 4px 0 var(--pad-dark), 0 0 30px rgb(79 181 98 / 0.55);
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--pad-dark); }
.btn.soft { background: #2A4B5C; color: var(--ink); box-shadow: 0 4px 0 #10242F; font-size: 1.1rem; }
.btn.soft:active { box-shadow: 0 1px 0 #10242F; }
.acts { flex-wrap: nowrap; width: 100%; max-width: 400px; }
.acts .btn { flex: 1 1 auto; min-height: 44px; font-size: 1.1rem; padding: 0.35em 0.5em; white-space: nowrap; }
.opts .btn { min-width: 72px; min-height: 48px; font-size: 1.4rem; padding: 0.2em 0.7em; font-variant-numeric: tabular-nums; }
.opts .btn:disabled { opacity: 0.35; cursor: not-allowed; }
.panel {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(94%, 400px); z-index: 3;
  display: flex; flex-direction: column; gap: 10px; align-items: center; padding: 14px 14px 16px; border-radius: 26px;
  background: var(--glass); border: 1px solid var(--edge); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  box-shadow: 0 20px 50px rgb(0 0 0 / 0.5); animation: panel 0.4s cubic-bezier(0.2, 1.5, 0.4, 1);
}
.panel h2 { margin: 0; font-size: 1.7rem; line-height: 1.1; font-weight: 800; text-wrap: balance; }
.panel .lead { font-size: 1.05rem; text-wrap: pretty; }

/* the vertical menu of sections */
.secs { width: min(100%, 560px); display: flex; flex-direction: column; gap: 10px; }
.sec { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; text-align: left; padding: 12px 16px; border-radius: 20px; border: 1px solid var(--edge); background: var(--glass); }
.sec:not(:disabled):hover { background: rgb(79 181 98 / 0.22); border-color: #7CF5B0; }
.sec:disabled { opacity: 0.5; cursor: not-allowed; }
.sec-n { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--pad); color: var(--on-pad); font: 800 1.5rem/1 var(--display); }
.sec.all .sec-n { background: var(--sun); color: #2A1C00; }
.sec-t { display: flex; flex-direction: column; min-width: 0; }
.sec-t b { font: 800 1.35rem/1.15 var(--display); }
.sec-t span { font-size: 0.95rem; color: var(--muted); }
.sec-p { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; font-weight: 800; font-size: 0.9rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pips { display: flex; gap: 3px; }
.pips i { width: 7px; height: 7px; border-radius: 50%; background: rgb(160 230 220 / 0.2); }
.pips i.ok { background: var(--sun); }

@keyframes slide { to { background-position: -200% 0; } }
@keyframes panel { from { transform: translate(-50%, -50%) scale(0.7); opacity: 0; } }
@keyframes shake { 20% { transform: translateX(-9px); } 50% { transform: translateX(8px); } 80% { transform: translateX(-5px); } }
@keyframes lit { 50% { filter: brightness(1.7) saturate(1.4); } }
@keyframes column { 0%, 100% { background: rgb(247 198 78 / 0.1); } 50% { background: rgb(247 198 78 / 0.34); } }
/* a tablet or a laptop: bigger type and the title back over the level */
@media (min-width: 700px) {
  .status.tip { font-size: 1.1rem; }
  #app.wide h1 { display: block; }
  .abacus { --u: clamp(22px, calc((100dvh - 500px) / 8.6), 44px); }
  .chip { padding-inline: 14px; }
  .panel { width: min(88%, 400px); gap: 12px; padding: 20px 20px 22px; }
}
/* with a mouse the small buttons can be smaller */
@media (min-width: 700px) and (pointer: fine) {
  .levels button { width: 34px; height: 34px; }
  .acts .btn { min-height: 0; }
}
/* a short window: the level drops the big title again */
@media (max-height: 700px) {
  body { padding-bottom: 14px; }
  #app.wide h1 { display: none; }
  .abacus { --u: clamp(22px, min(7.6vw, calc((100dvh - 330px) / 8.6)), 44px); }
}
/* a phone on its side: the abacus takes the whole height on the right, the rest stacks on the left */
@media (orientation: landscape) and (max-height: 520px) {
  #app { max-width: 900px; }
  #app.wide header { display: none; }
  #joc.lvl { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 24px; justify-items: center; align-content: start; }
  #joc.lvl > * { grid-column: 1; }
  #joc.lvl .stage { grid-column: 2; grid-row: 1 / span 6; width: auto; align-self: start; }
  .abacus { --u: clamp(18px, calc((100dvh - 150px) / 8.6), 44px); width: calc(var(--n) * var(--u) * 2.5 + 28px); }
}
@media (prefers-reduced-motion: reduce) {
  h1, .panel, .abacus.shake, .bead.wave, .bead.next { animation: none; }
  .bead { transition: none; }
  .rod.glow { animation: none; background: rgb(247 198 78 / 0.28); }
}
</style>

<canvas id="sky" aria-hidden="true"></canvas>
<main id="app">
  <div class="top"><span><a class="link" id="toG" href="index.html">← Tots els jocs</a><button class="link" id="toM" hidden>← Seccions</button></span><button class="link" id="so"></button></div>
  <header><p class="kicker" id="kick"></p><h1>L'àbac xinès</h1></header>
  <section id="joc"></section>
</main>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
/* LOGIC-START */
// A Chinese abacus. Each rod has five earth beads under the beam, worth 1 each, and one heaven bead over it, worth 5.
// A bead only counts while it touches the beam. A rod is { lo, hi }: how many earth beads are up and whether the heaven bead is down (1 or 0).
// rods[0] is the units. A rod can hold up to 10: a full rod is exchanged for one earth bead on its left.
const rodVal = r => r.lo + 5 * r.hi;
const valueOf = rods => rods.reduce((a, r, p) => a + rodVal(r) * 10 ** p, 0);
// the tidy way to show a number: no rod with five earth beads up
const tidy = rods => rods.every(r => r.lo < 5);
const write = (v, n) => Array.from({ length: n }, (_, p) => { const d = Math.floor(v / 10 ** p) % 10; return { lo: d % 5, hi: d >= 5 ? 1 : 0 }; });
// touching a bead moves it together with the ones between it and the beam; j counts the beads of a deck from the beam
function tap(rods, p, deck, j) { const out = rods.map(r => ({ ...r })); out[p][deck] = j < out[p][deck] ? j : j + 1; return out; }

// q is a number to write or an operation read from left to right ('x' times, ':' divided by; these two only come first).
// The abacus starts on the first number when beads are added to it or taken from it, and empty otherwise.
// stages are the values to pass through on the way to the result: they keep the hints on the method instead of on the answer.
function plan(q) {
  const t = String(q).split(/([+\-x:])/), a = +t[0], stages = [];
  if (t.length === 1) return { start: 0, stages: [a], goal: a };
  // the digits of v times k, from the highest place down, as running totals
  const parts = (v, k) => [...String(v)].map((d, i, all) => d * 10 ** (all.length - 1 - i) * k).filter(Boolean).map((s => x => s += x)(0));
  let acc = a;
  for (let i = 1; i < t.length; i += 2) {
    const op = t[i], b = +t[i + 1];
    if (op === '+') stages.push(acc += b);
    else if (op === '-') stages.push(acc -= b);
    else if (op === ':') stages.push(...parts(acc /= b, 1));
    else {
      // two digits of the tables, on their own: add the bigger one as many times as the smaller says. Otherwise, one product per digit.
      const big = Math.max(acc, b), small = Math.min(acc, b);
      stages.push(...(big < 10 && t.length === 3 ? Array.from({ length: small }, (_, k) => big * (k + 1)) : parts(big, small)));
      acc *= b;
    }
  }
  return { start: '+-'.includes(t[1]) ? a : 0, stages, goal: acc };
}

// One touch towards target, the way the abacus is worked: from the highest column down, adding or taking what is missing.
// Returns { p, deck, to, why } (set rods[p][deck] to `to`), or null when the abacus shows target in its tidy form. why is
// 'add' or 'take' for a plain move, 'five' and 'ten' for the two exchanges, 'borrow' for taking one from a higher column,
// 'more' or 'less' for the trick with the heaven bead: adding d as 5 - (5 - d), or taking it the same way, and 'carry' for
// adding d where it does not fit, as 10 - (10 - d). The tricks start with the earth beads, so the column never goes past
// what it needs and the next hint finds the 5 or the 10 still to be moved.
function nextMove(rods, target) {
  const diff = target - valueOf(rods), n = rods.length;
  if (!diff) {
    const p = rods.findIndex(r => r.lo === 5);
    if (p < 0) return null;
    // a full column becomes one earth bead on the left: the heaven bead goes first, and the five earth beads follow below
    return rods[p].hi ? { p, deck: 'hi', to: 0, why: 'ten' } : { p, deck: 'lo', to: 0, why: 'five' };
  }
  const abs = Math.abs(diff), p = Math.min(String(abs).length - 1, n - 1), d = Math.min(10, Math.floor(abs / 10 ** p)), r = rods[p];
  if (diff > 0) {
    const v = rodVal(r), k = 10 - d;
    if (v + d < 10 || (v + d === 10 && r.lo < 5)) {
      if (d >= 5 && !r.hi) return { p, deck: 'hi', to: 1, why: 'add' };
      // the fifth earth bead only goes up to complete a five or to fill the column
      if (r.lo + d <= 5) return { p, deck: 'lo', to: r.lo + d, why: 'add' };
      return { p, deck: 'lo', to: r.lo + d - 5, why: 'more', d };
    }
    // it does not fit: take 10 - d from this column, and the next move puts one bead on the left
    if (!r.hi) return { p, deck: 'lo', to: r.lo - k, why: k === 5 ? 'ten' : 'carry', d };
    // not enough earth beads to take: add the ones over five first, and then the five is the one that does not fit
    if (k < 5 && r.lo < k) return { p, deck: 'lo', to: r.lo + d - 5, why: 'add' };
    return k % 5 ? { p, deck: 'lo', to: r.lo - k % 5, why: 'carry', d } : { p, deck: 'hi', to: 0, why: 'carry', d };
  }
  const take = (p, d, why) => {
    const r = rods[p];
    if (d >= 5 && r.hi) return { p, deck: 'hi', to: r.hi - 1, why };
    if (d <= r.lo) return { p, deck: 'lo', to: r.lo - d, why };
    if (d < 5 && r.hi) return why === 'take' ? { p, deck: 'lo', to: r.lo + 5 - d, why: 'less', d } : { p, deck: 'hi', to: r.hi - 1, why };
  };
  let m = take(p, d, 'take');
  // not enough on this column: one from the nearest column on the left that has something
  for (let q = p + 1; !m && q < n; q++) m = take(q, 1, 'borrow');
  // nothing on the left either, so a column on the right is overfull: empty that one
  for (let q = p - 1; !m && q >= 0; q--) if (rodVal(rods[q])) m = take(q, Math.min(9, rodVal(rods[q])), 'take');
  return m;
}

// Six sections of ten levels. A level asks for q (see plan) or, with read, shows a number to be picked among opts.
// show keeps the value of each column written under it.
const SECTIONS = [
  { name: "Coneix l'àbac", sub: "Llegeix i escriu nombres", levels: [
    { name: "Les boles de baix", q: '3', show: 1,
      tip: "Cada bola de baix val 1, però només compta quan toca la barra del mig. Toca una bola per pujar-la. Quan l'àbac marqui 3, prem Comprova.",
      hints: ["Fes servir la columna de la dreta: és la de les unitats.", "Si toques la tercera bola, pugen totes tres alhora."] },
    { name: "La bola de dalt", q: '5', show: 1,
      tip: "Les boles de dalt valen 5 cadascuna. Compten quan les baixes fins a la barra. Escriu el 5 amb una sola bola.",
      hints: ["Per escriure 5 n'hi ha prou amb una bola de dalt.", "Cinc boles de baix també fan 5, però l'àbac queda desendreçat: sempre es canvien per una de dalt."] },
    { name: "Cinc i dos", q: '7', show: 1,
      tip: "Els nombres del 6 al 9 es fan amb la bola de dalt i unes quantes de baix: 7 és 5 i 2.",
      hints: ["Comença per la bola que val 5.", "Quant falta de 5 fins a 7? Aquestes són les boles de baix."] },
    { name: "Quin nombre és?", read: 8, opts: [3, 8, 4, 9],
      tip: "Ara et toca llegir. Quin nombre marca l'àbac? Només compten les boles que toquen la barra.",
      hints: ["Una bola de dalt a la barra val 5. Suma-hi les de baix que toquen la barra.", "Compta: 5 i quantes més?"] },
    { name: "Les desenes", q: '20', show: 1,
      tip: "Cada columna val deu vegades més que la de la seva dreta. La segona columna és la de les desenes: allà, una bola de baix val 10.",
      hints: ["Per escriure 20 calen 2 desenes i cap unitat.", "Les lletres de sota t'ho recorden: U vol dir unitats i D, desenes."] },
    { name: "Dues columnes", q: '36', show: 1,

    for (let i = 0; i < n; i++) {
      const ang = rand(0, 6.283), v = power * rand(0.35, 1.5), life = rand(0.45, 1.05);
      parts.push({ x, y, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v, g, life, max: life, z: rand(4, 11), h: h + rand(-22, 22) });
    }
  }
  function ring(x, y, h, r0, r1, life = 0.6) { if (!RM) rings.push({ x, y, h, r0, r1, life, max: life }); }
  // fireworks over the upper half of the screen
  function celebrate(n = 9) {
    for (let k = 0; k < n; k++) setTimeout(() => {
      const x = W * rand(0.12, 0.88), y = H * rand(0.12, 0.6), h = rand(0, 360);
      burst(x, y, h, 46, 330, 220); ring(x, y, h, 6, 120, 0.8); tone(pick([784, 880, 1047, 1175, 1319]), 0, 0.3, 0.05);
    }, k * 170);
  }
  addEventListener('resize', resize); resize();
  if (!RM) requestAnimationFrame(t => { last = t; frame(t); });
  return { burst, ring, celebrate, mood(sec) { target = [165, 205, 262, 318, 28, 120][sec] ?? 165; } };
})();

/* ---------- screens ---------- */
// the link to the page of all games only exists where this page is served under its own file name, next to the others
const HUB = /abac-xines\.html$/.test(location.pathname);
function show(level, kicker) {
  $('#app').classList.toggle('wide', level); $('#joc').classList.toggle('lvl', level);
  $('#toG').hidden = level || !HUB; $('#toM').hidden = !level; $('#kick').textContent = kicker;
}
function panel(host, html) {
  host.querySelector('.panel')?.remove();
  host.insertAdjacentHTML('beforeend', `<div class="panel">${html}</div>`);
  host.querySelector('.panel button').focus({ preventScroll: true });
}
function soBtn() { $('#so').textContent = `So: ${prog.so ? 'sí' : 'no'}`; }
$('#so').onclick = () => { prog.so = !prog.so; save(); soBtn(); if (prog.so) tone(660, 0, 0.2); };
$('#toM').onclick = () => seccions();

const secOpen = s => s === 0 || prog.secs[s - 1] >= 10;
function seccions() {
  fresh(); show(false, 'Tria una secció'); FX.mood(0);
  const root = $('#joc'); root.onclick = null;
  root.innerHTML = `<p class="status tip">Mou les boles de l'àbac per fer operacions, com es fa a la Xina des de fa segles. A cada secció aprendràs un truc nou.</p>
    <nav class="secs" aria-label="Seccions">${SECTIONS.map((s, i) => { const n = prog.secs[i]; return `<button class="sec${n >= 10 ? ' all' : ''}" data-s="${i}"${secOpen(i) ? '' : ' disabled'}>
      <span class="sec-n">${i + 1}</span><span class="sec-t"><b>${s.name}</b><span>${secOpen(i) ? s.sub : 'Acaba la secció anterior per obrir-la'}</span></span>
      <span class="sec-p"><span class="pips">${Array.from({ length: 10 }, (_, k) => `<i${k < n ? ' class="ok"' : ''}></i>`).join('')}</span>${n} de 10</span></button>`; }).join('')}</nav>`;
  root.querySelector('.secs').onclick = e => { const b = e.target.closest('.sec'); if (b && !b.disabled) nivell(+b.dataset.s, Math.min(prog.secs[+b.dataset.s], 9)); };
  root.querySelector('.sec:not(:disabled)').focus({ preventScroll: true });
}

/* ---------- one level: an operation and the abacus to solve it on ---------- */
const HUES = [150, 190, 258, 325, 28], PLACE = ['U', 'D', 'C', 'UM', 'DM'];
const COL = ['de les unitats', 'de les desenes', 'de les centenes', 'dels milers', 'de les desenes de miler'];
const SIGN = { '+': '+', '-': '−', x: '×', ':': ':' };
const HURRAY = ['Molt bé!', 'Perfecte!', 'Genial!', 'Ben calculat!', 'Així es fa!'];
// what to say when a hint is one of the tricks rather than a plain move; d is the digit being added or taken
const WHY = {
  more: d => `Per sumar-ne ${d} aquí no hi ha prou boles de baix. Un truc: ${d} és 5 menys ${5 - d}. Treu-ne ${5 - d} de baix i després baixa la bola de dalt.`,
  less: d => `Per treure'n ${d} aquí no hi ha prou boles de baix. Un truc: ${d} és 5 menys ${5 - d}. Posa'n ${5 - d} de baix i després puja la bola de dalt.`,
  five: () => "Cinc boles de baix valen el mateix que una de dalt. Fes el canvi: baixa'n cinc i posa'n una de dalt.",
  ten: () => "Una columna plena val 10. Fes el canvi: buida-la i puja una bola de baix a la columna de l'esquerra.",
  carry: d => `Aquí no hi caben ${d} més. Un truc: ${d} és 10 menys ${10 - d}. Treu-ne ${10 - d} d'aquesta columna i després puja una bola de baix a la columna de l'esquerra.`,
  borrow: () => "A la dreta no n'hi ha prou per treure. Demana una bola a aquesta columna: val 10 de les de la seva dreta."
};

function nivell(sec, idx) {
  const t = fresh(); show(true, `Secció ${sec + 1} · ${SECTIONS[sec].name}`); FX.mood(sec);
  const root = $('#joc'), lv = LEVELS[sec * 10 + idx], reading = lv.read != null;
  const pl = reading ? { start: lv.read, stages: [lv.read], goal: lv.read } : plan(lv.q);
  const n = Math.max(3, String(Math.max(pl.start, ...pl.stages)).length);
  const op = !reading && /\D/.test(lv.q);
  const ask = reading ? "Quin nombre marca l'àbac?" : op ? lv.q.replace(/\D/g, o => ` ${SIGN[o]} `) + ' = ' : `Escriu el <b>${lv.q}</b>`;
  // stage is how many of the values on the way have been reached. Hint state: how many were asked, the abacus as it stood
  // at the last one (asking again without moving gives the bead away), and what is glowing.
  let rods = write(pl.start, n), stage = 0, asks = 0, seen = '', mark = null, done = false, digits = !!lv.show;
  root.innerHTML = `<div class="hud"><span class="chip">Nivell ${idx + 1} · ${lv.name}</span></div>
    <nav class="levels" aria-label="Nivells">${SECTIONS[sec].levels.map((_, i) => `<button data-n="${i}" class="${i < prog.secs[sec] ? 'done' : ''}"${i === idx ? ' aria-current="true"' : ''}${i > prog.secs[sec] ? ' disabled title="Supera el nivell anterior"' : ''}>${i + 1}</button>`).join('')}</nav>
    <p class="status tip" id="tip" role="status" aria-live="polite"></p>
    <p class="task" id="task"></p>
    <div class="stage" id="stage"><div class="abacus${reading ? ' locked' : ''}" id="ab" role="group" aria-label="Àbac" style="--n:${n}">
      <div class="well">${rods.map((_, i) => { const p = n - 1 - i, bead = (deck, j) => `<button class="bead" data-p="${p}" data-deck="${deck}" data-j="${j}"></button>`;
        return `<div class="rod" data-p="${p}" style="--h:${HUES[p]}"><div class="deck hi">${bead('hi', 0)}</div><div class="beam"></div><div class="deck lo">${[0, 1, 2, 3, 4].map(j => bead('lo', j)).join('')}</div></div>`; }).join('')}</div>
      <div class="foot" aria-hidden="true">${rods.map((_, i) => `<span style="--h:${HUES[n - 1 - i]}"><b></b><i>${PLACE[n - 1 - i]}</i></span>`).join('')}</div></div></div>
    ${reading ? `<div class="opts" id="opts">${lv.opts.map(v => `<button class="btn soft" data-v="${v}">${v}</button>`).join('')}<button class="btn soft" id="hintb">Pista</button></div>`
      : `<div class="acts"><button class="btn" id="chk">Comprova</button><button class="btn soft" id="rst">Reinicia</button><button class="btn soft" id="hintb">Pista</button></div>`}`;
  const ab = $('#ab'), beads = [...ab.querySelectorAll('.bead')], cols = [...ab.querySelectorAll('.rod')], foot = [...ab.querySelectorAll('.foot b')];
  // the row of levels scrolls sideways on a phone: start with this level in the middle
  { const nav = root.querySelector('.levels'), a = nav.getBoundingClientRect(), c = nav.querySelector('[aria-current]').getBoundingClientRect(); nav.scrollLeft += c.left - a.left - (a.width - c.width) / 2; }
  const tip = (txt, cls) => { const e = $('#tip'); e.className = 'status tip' + (cls ? ' ' + cls : ''); e.textContent = txt; };
  const target = () => pl.stages[Math.min(stage, pl.stages.length - 1)];
  const mid = e => { const r = e.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width }; };
  // the bead a move asks to touch: the far end of the group that has to travel
  const beadOf = m => { const cur = rods[m.p][m.deck], j = m.to > cur ? m.to - 1 : m.to; return beads.find(b => +b.dataset.p === m.p && b.dataset.deck === m.deck && +b.dataset.j === j); };

  function draw() {
    for (const b of beads) {
      const p = +b.dataset.p, hi = b.dataset.deck === 'hi', j = +b.dataset.j, on = j < rods[p][b.dataset.deck];
      // earth beads that count sit against the beam above them, the heaven bead against the beam below
      b.style.setProperty('--s', hi ? +on : on ? j : j + 1);
      b.classList.toggle('on', on); b.classList.remove('next');
      b.setAttribute('aria-label', `Bola ${hi ? 'de dalt' : `de baix ${j + 1}`}, columna ${COL[p]}${on ? ', toca la barra' : ''}`);
      b.tabIndex = reading || done ? -1 : 0;
    }
    cols.forEach(c => c.classList.toggle('glow', !!mark && mark.p === +c.dataset.p));
    if (mark && mark.m) { const b = beadOf(mark.m), up = (mark.m.deck === 'lo') === (mark.m.to > rods[mark.m.p][mark.m.deck]); b.classList.add('next'); b.dataset.a = up ? '▲' : '▼'; }
    foot.forEach((e, i) => { const v = rodVal(rods[n - 1 - i]); e.textContent = digits ? v : ''; e.classList.toggle('over', v > 9); });
    $('#task').innerHTML = ask + (op ? `<b>${done ? pl.goal : '?'}</b>` : '');
  }

  function oops(txt) {
    ab.classList.remove('shake'); void ab.offsetWidth; ab.classList.add('shake'); tone(150, 0, 0.45, 0.16, 'triangle');
    tip(txt, 'oops');
  }
  async function win() {
    done = true; mark = null; ab.classList.add('locked'); draw();
    if (idx + 1 > prog.secs[sec]) { prog.secs[sec] = idx + 1; save(); }
    const end = idx === 9, last = end && sec === SECTIONS.length - 1, lit = beads.filter(b => b.classList.contains('on'));
    tip(reading ? `Sí! L'àbac marca ${pl.goal}.` : `Correcte! L'àbac marca ${pl.goal}.`, 'go');
    lit.forEach((b, i) => { const p = mid(b), h = b.dataset.deck === 'hi' ? 44 : HUES[b.dataset.p]; b.style.setProperty('--d', i * 70); b.classList.add('wave'); FX.burst(p.x, p.y, h, 12, p.w * 2); });
    chime([523, 659, 784, 1047, 1319]); FX.celebrate(end ? 16 : 8);
    await sleep(1100); if (!t.on) return;
    panel($('#stage'), `<h2>${last ? "Ets un mestre de l'àbac!" : end ? 'Secció superada!' : pick(HURRAY)}</h2>
      <p class="lead">${last ? 'Has sumat, restat, multiplicat i dividit movent boles, com els calculistes de fa mil anys.' : end ? `Has obert la secció ${sec + 2}: ${SECTIONS[sec + 1].name}.` : `Nivell ${idx + 1} superat.`}</p>
      <button class="btn" id="nx">${last ? 'Torna a les seccions' : end ? 'Secció següent' : 'Nivell següent'}</button>`);
    $('#nx').onclick = () => last ? seccions() : end ? nivell(sec + 1, 0) : nivell(sec, idx + 1);
  }
  function check() {
    const v = valueOf(rods);
    if (v === pl.goal && tidy(rods)) return win();
    if (v !== pl.goal) return oops(`Ara l'àbac marca ${v}, i encara no és el resultat. Si no saps com seguir, prem Pista.`);
    // the right number with a column left overfull: point at it
    const p = rods.findIndex(r => r.lo === 5);
    mark = { p }; draw();
    oops("El nombre és correcte, però l'àbac està desendreçat. " + (rods[p].hi ? "Una columna plena es canvia per una bola de baix de la columna de l'esquerra." : 'Cinc boles de baix es canvien per una de dalt.'));
  }
  // The first hint lights the column to work on and says what to think about. Asked again with the abacus untouched,
  // the bead to touch turns gold and the move is spelled out.
  function coach() {
    if (done) return;
    const hint = lv.hints[asks++ % lv.hints.length];
    if (reading) {
      // reading has no move to give away: the second hint writes what each column is worth under it
      if (asks > 1) { digits = true; mark = null; draw(); return tip('Sota cada columna hi ha el que val. Ajunta les xifres d\'esquerra a dreta. ' + hint); }
      mark = { p: n - 1 - cols.findIndex(c => rodVal(rods[+c.dataset.p])) }; draw();
      return tip('Comença per la columna que brilla. ' + hint);
    }
    const m = nextMove(rods, target());
    if (!m) return tip("L'àbac ja marca el resultat. Prem Comprova!", 'go');
    const now = JSON.stringify(rods), again = now === seen, k = Math.abs(m.to - rods[m.p][m.deck]);
    seen = now; mark = { p: m.p, m: again ? m : null }; draw();
    if (!again) return tip("Fixa't en la columna que brilla. " + (WHY[m.why] ? WHY[m.why](m.d) : hint));
    const up = (m.deck === 'lo') === (m.to > rods[m.p][m.deck]);
    tip(`${up ? 'Puja' : 'Baixa'} ${k} ${k > 1 ? 'boles' : 'bola'} ${m.deck === 'hi' ? 'de dalt' : 'de baix'} a la columna ${COL[m.p]}: toca la bola daurada.`);
  }

  ab.onclick = e => {
    const b = e.target.closest('.bead'); if (!b || done) return;
    if (reading) return tip("En aquest nivell les boles no es mouen. Llegeix el nombre i tria'l a sota.");
    const p = +b.dataset.p, deck = b.dataset.deck, was = rods[p][deck];
    rods = tap(rods, p, deck, +b.dataset.j); mark = null;
    const k = pl.stages.lastIndexOf(valueOf(rods)); if (k >= stage) stage = k + 1;
    draw(); tone(noteOf(p * 2 + (deck === 'hi' ? 4 : 0) + rods[p][deck]), 0, 0.16, 0.08, 'triangle');
    if (rods[p][deck] > was) { const c = mid(b); FX.burst(c.x, c.y, deck === 'hi' ? 44 : HUES[p], 7, c.w * 1.3); }
  };
  root.onclick = e => {
    const b = e.target.closest('button'); if (!b || done) return;
    if (b.id === 'chk') check();
    else if (b.id === 'hintb') coach();
    else if (b.id === 'rst') { rods = write(pl.start, n); stage = 0; mark = null; draw(); tip(lv.tip); tone(330, 0, 0.12, 0.06); }
    else if ('v' in b.dataset) {
      if (+b.dataset.v === pl.goal) return win();
      b.disabled = true; oops('No és aquest. Compta només les boles que toquen la barra. Si no saps com seguir, prem Pista.');
    }
  };
  root.querySelector('.levels').onclick = e => { const b = e.target.closest('button'); if (b && !b.disabled) nivell(sec, +b.dataset.n); };
  tip(lv.tip); draw();
}

soBtn();
seccions();
</script>
